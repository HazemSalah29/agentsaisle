<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width={{W}}">
<style>
{{FONTFACE}}
:root{--bg:{{BG}};--ink:{{INK}};--accent:{{ACCENT}}}
*{box-sizing:border-box;margin:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:{{FONT_BODY}},-apple-system,"Helvetica Neue",Arial,sans-serif;padding:96px 96px 120px}
.safe{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;gap:40px}
.bar{position:absolute;left:0;top:0;height:14px;width:{{PCT}}%;background:var(--accent);display:{{BAR}}}
.lead{font-family:{{FONT_HEAD}},-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:80px;line-height:1.1;font-weight:800;color:var(--accent)}
.txt{flex:1 1 auto;min-height:0;max-height:100%;overflow:hidden;font-size:54px;line-height:1.35;font-weight:500}
.txt p{margin:0 0 .7em}
.txt p:last-child{margin-bottom:0}
span[lang=ar]{font-family:"Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;font-size:1.15em}
.ar{font-family:"Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;font-size:1.25em;line-height:1.8;text-align:right}
.source{font-size:30px;opacity:.6;line-height:1.3}
.handle{position:absolute;left:96px;bottom:48px;font-size:28px;opacity:.6}
.num{position:absolute;right:96px;bottom:48px;font-size:28px;opacity:.6}
</style></head><body>
<div class="bar"></div>
<div class="safe" id="safe">{{LEAD}}<div class="txt" id="txt">{{TEXT}}</div>{{SOURCE}}</div>
<div class="handle">{{HANDLE}}</div><div class="num">{{NUM}}</div>
<script>
window.overflow=false;
(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){
  var t=document.getElementById('txt'),s=document.getElementById('safe');
  window.overflow=t.scrollHeight>t.clientHeight+1||s.scrollHeight>s.clientHeight+1;
  window.ready=true;
});
</script></body></html>
