can_do:
  - "Explain an idea, algorithm or API in a short video, with real simulations and code"
  - "Make a punchy motion-graphics video where bold words pop in as they are spoken, with slash-cut transitions"
  - "Make a showcase or demo video of your app or brand"
  - "Make AI clips with Higgsfield when you ask for it (paid; you approve the shot list first)"
  - "Make a fast product or launch edit from your own photos, with music and sound"
  - "Cut, caption, reframe and clean up footage you already have"
  - "Turn a README, a repo, a pull request, an outage or live data into a video"
  - "Animate Arabic quotes, or dub a video into Arabic or English"
  - "Check the result, then prepare it for YouTube, Shorts, Reels, TikTok or LinkedIn (nothing is uploaded)"
setup:
  - title: "Install the skill"
    text: "Run the install command above. Open Claude Desktop or Claude Code in your project, type /video and say what you want. Everything works for free on your own computer."
  - title: "Only for Higgsfield: add the connector"
    text: "You need this only if you ask /video for a Higgsfield video; nothing else uses it. In Claude Desktop: Settings, Connectors, Add custom connector. Name it Higgsfield, paste https://mcp.higgsfield.ai/mcp, save, then sign in to your Higgsfield account when asked. In Claude Code: run claude mcp add --transport http higgsfield https://mcp.higgsfield.ai/mcp, then /mcp to sign in."
  - title: "Know what it costs"
    text: "Higgsfield is a paid service with a small free allowance (about 10 credits), and its website's free perks do not apply through the connector. Before it makes anything, /video shows the shot list and the credit total and waits for your yes."
