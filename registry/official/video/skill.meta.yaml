version: 0.30.0
category: [video]
clients: [claude-code]
runs_scripts: true
niche: video
kind: quality
tier: specialty
permissions:
  tools: [Read, Write, Glob, Bash]
  writes_files: true
  runs_scripts: true
  network: false
  needs_api_keys: []
requires:
  - video-brand
  - video-core
  - video-explain
  - video-kinetic
  - video-publish
  - video-qa
  - animate-reel
  - animate-reel-build
  - animate-reel-carousel
  - animate-reel-parable
  - animate-reel-sfx-1
  - animate-reel-sfx-2
  - animate-reel-sfx-3
  - animate-reel-sfx-4
  - animate-reel-sounds
  - animate-reel-story
  - animate-reel-storyboard
  - animate-reel-style
  - animate-reel-topic
  - video-showcase
  - video-voice
  - video-write
can_do:
  - "Explain an idea, algorithm or API in a 30 to 45 second short, with code, diagrams and real simulations"
  - "Make a kinetic-type short where bold words hit as they are spoken, with slab cuts and sound design"
  - "Make a showcase of your own app: a scripted recording with a camera that follows the action"
  - "Write the hook and script to a short-form quality bar, then review each draft against a score card"
  - "Voice it locally for free (Kokoro), with burned captions, an original music bed and sound effects"
  - "Make a motion-graphics Instagram reel or carousel for your page from a checked source (/video reel)"
  - "Check the result, then prepare it for YouTube Shorts, Reels, TikTok or LinkedIn (nothing is uploaded)"
setup:
  - title: "Install the skill"
    text: "Run the install command above. Open Claude Desktop (Code tab, Local) or Claude Code in an empty folder, type /video and say what you want."
  - title: "Set up the Remotion engine once"
    text: "The first time, /video writes the engine's package.json to ~/.aisle-video/remotion and shows two commands to run there: npm install, then npx remotion@4.0.540 browser ensure (about 350 MB in all). Remotion is free for individuals and companies of up to 3 people; larger companies need a Remotion company licence."
  - title: "Add the free voice"
    text: "pip install kokoro-onnx soundfile, then put kokoro-v1.0.onnx and voices-v1.0.bin (from the kokoro-onnx GitHub releases) in ~/.aisle-video/kokoro. /video doctor shows what is ready. Your own recording works too, with no setup."
  - title: "For /video reel, install its tools"
    text: "ffmpeg, Google Chrome, Node 18+, Python 3 with numpy, scipy and pillow (pip install numpy scipy pillow), and Playwright (npm i -g playwright). /video reel checks for them and lists only what is missing; it installs nothing. The reel sound packs add about 85 MB to the install; they are bundled, so a reel downloads nothing."
  - title: "Optional: a voiceover for reels"
    text: "Make an ElevenLabs key and set ELEVENLABS_API_KEY in your own shell or system environment. The key never goes in the chat. Without it, reels use sound effects over a calm bed and no voice."
friendly:
  headline: "Say what video you want. Get it made."
  intro: "Describe your idea in plain words. Claude writes it, adds the voice, the pictures and the sound, and hands you a finished video on your own computer."
  ideas:
    - title: "Explain something"
      text: "A short video that makes one idea easy to get, with animated pictures and a voice."
      say: "Make a short video explaining how email works"
    - title: "Words that hit"
      text: "Big bold words that pop on screen in time with the voice."
      say: "Make a punchy video: three reasons to start before you are ready"
    - title: "Show off your app"
      text: "A recorded walk-through of your own app or website, with a moving camera."
      say: "Make a demo video of my website"
    - title: "Reels for your page"
      text: "Animated Instagram reels and carousels, with a story and sound."
      say: "Make an Instagram reel about patience"
  firstTime: "The first time, Claude checks your computer and tells you if anything is missing, with the exact line to copy. There is nothing to prepare."
