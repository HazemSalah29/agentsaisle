version: 0.29.0
category: [video]
clients: [claude-code]
runs_scripts: true
niche: video
kind: quality
tier: specialty
permissions:
  tools: [Read, Write, Glob, Bash]
  writes_files: true
  runs_scripts: true
  network: false
  needs_api_keys: []
requires:
  - video-brand
  - video-core
  - video-explain
  - video-kinetic
  - video-publish
  - video-qa
  - video-showcase
  - video-voice
  - video-write
can_do:
  - "Explain an idea, algorithm or API in a 30 to 45 second short, with code, diagrams and real simulations"
  - "Make a kinetic-type short where bold words hit as they are spoken, with slab cuts and sound design"
  - "Make a showcase of your own app: a scripted recording with a camera that follows the action"
  - "Write the hook and script to a short-form quality bar, then review each draft against a score card"
  - "Voice it locally for free (Kokoro), with burned captions, an original music bed and sound effects"
  - "Check the result, then prepare it for YouTube Shorts, Reels, TikTok or LinkedIn (nothing is uploaded)"
setup:
  - title: "Install the skill"
    text: "Run the install command above. Open Claude Desktop (Code tab, Local) or Claude Code in an empty folder, type /video and say what you want."
  - title: "Set up the Remotion engine once"
    text: "The first time, /video writes the engine's package.json to ~/.aisle-video/remotion and shows two commands to run there: npm install, then npx remotion@4.0.540 browser ensure (about 350 MB in all). Remotion is free for individuals and companies of up to 3 people; larger companies need a Remotion company licence."
  - title: "Add the free voice"
    text: "pip install kokoro-onnx soundfile, then put kokoro-v1.0.onnx and voices-v1.0.bin (from the kokoro-onnx GitHub releases) in ~/.aisle-video/kokoro. /video doctor shows what is ready. Your own recording works too, with no setup."
