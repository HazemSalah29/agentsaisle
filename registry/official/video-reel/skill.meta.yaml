version: 0.1.0
category: [video]
clients: [claude-code]
niche: video
kind: quality
tier: specialty
runs_scripts: true
permissions:
  tools: [Read, Write, Glob, Grep, Bash]
  writes_files: true
  runs_scripts: true
  network: true
  needs_api_keys: []
can_do:
  - "Make a motion-graphics Instagram reel (1080x1920 MP4) from a checked source, with the user's yes at each stop"
  - "Check every fact on its primary page before writing a word, and keep the sources with the reel"
  - "Pitch looks from 60 style recipes, each shown as a real still, then storyboard and build the one you pick"
  - "Mix sparse sound effects over a calm bed from 330+ bundled sounds, with an optional ElevenLabs voiceover"
  - "Check pacing, readability, flashing, sync and loudness before the file is handed over"
  - "Make carousels (PNG slides and a caption) and made-up stories that teach one lesson"
  - "Keep a notes folder that learns your taste after every reel and suggests what to make next"
setup:
  - title: "Install the skill"
    text: "Run the install command above. It also installs the sound packs (about 85 MB in all) and the step skills. Open Claude Desktop (Code tab, Local) or Claude Code in an empty folder and type /video reel."
  - title: "Install the tools it needs"
    text: "ffmpeg, Google Chrome, Node 18+, Python 3 with numpy, scipy and pillow (pip install numpy scipy pillow), and Playwright (npm i -g playwright). /video reel checks for them and lists only what is missing; it installs nothing itself."
  - title: "Tell it about your page"
    text: "The first run asks a few short questions (name, handle, niche, voice, colours, the one word you ask people to comment) and saves them in 00 - notes/context/declared/brand.md. You can edit that file any time."
  - title: "Optional: a voiceover voice"
    text: "Make an ElevenLabs key and set ELEVENLABS_API_KEY in your own shell or system environment. The key never goes in the chat. Without it, reels use sound effects over a calm bed and no voice."
  - title: "Optional: Obsidian"
    text: "Open the studio folder as a vault in Obsidian to read your idea boards and notes. The reels work without it."
part_of: video
