<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#04070c}
canvas{position:absolute;left:0;top:0;width:1080px;height:1920px}
.txt{position:absolute;left:100px;right:100px;text-align:center;color:#e9eef2;font-family:"Avenir Next","Gill Sans",sans-serif;font-weight:300;font-size:50px;line-height:1.3;text-wrap:balance;opacity:0;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.sm{font-size:28px;letter-spacing:.22em;text-transform:uppercase;color:rgba(190,215,228,.7)}
.warm{color:#f2d79a}
#hd{position:absolute;bottom:250px;left:0;right:0;text-align:center;font-family:"Avenir Next",sans-serif;font-size:22px;letter-spacing:.2em;color:rgba(233,238,242,.55)}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="txt" id="a1" style="top:300px">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="txt warm" id="a2" style="top:500px;font-weight:400">It is not the biggest one.</div>
<div class="txt sm" id="l1" style="top:640px">one night of rain</div>
<div class="txt sm" id="l2" style="top:1075px">one drop, each day</div>
<div class="txt warm" id="b2" style="top:1500px;font-size:46px;font-weight:400">Same days. One kept going.</div>
<div id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
// stateless hash: same input, same output
const H=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
// two pools: upper (downpour that stops), lower (a single drip that keeps going)
const P1={cx:540,cy:880,rx:400,ry:150},P2={cx:540,cy:1310,rx:400,ry:150};
const drops=[]; // {pool,t,x,y,s}
// upper pool: sparse hook drops, then a downpour 4.6-5.7, then nothing
[0.6,1.7,2.9,3.8].forEach((t,i)=>drops.push({p:1,t,x:(H(i+1)-.5)*500,y:(H(i+9)-.5)*150,s:.8}));
for(let k=0;k<26;k++){const t=4.6+k*.042+H(k+40)*.03;drops.push({p:1,t,x:(H(k+50)-.5)*660,y:(H(k+80)-.5)*220,s:1.1+H(k+7)*.5})}
// lower pool: one steady drip in the same place, every .72 s from 5.0
for(let k=0;5.0+k*.72<9.9;k++)drops.push({p:2,t:5.0+k*.72,x:0,y:0,s:1});
drops.forEach((d,i)=>{if(d.p===1&&(i<4||i%4===0))add(d.t,i<4?'drop':'tick',i<4?.18:.12);if(d.p===2)add(d.t+.02,'drop',.22)});
add(0.15,'bong',.3);add(5.0,'bong',.25);
const cv=$('c'),g=cv.getContext('2d');
function pool(P,t,list,lit){
  g.save();g.beginPath();g.ellipse(P.cx,P.cy,P.rx,P.ry,0,0,7);g.clip();
  let gr=g.createRadialGradient(P.cx,P.cy-30,10,P.cx,P.cy,P.rx);
  gr.addColorStop(0,'#16303f');gr.addColorStop(.7,'#0b1823');gr.addColorStop(1,'#070e15');
  g.fillStyle=gr;g.fillRect(P.cx-P.rx,P.cy-P.ry,P.rx*2,P.ry*2);
  // window light sliding across the water: a skewed bright band, position is a function of t
  const lx=P.cx-520+t*108;g.globalCompositeOperation='lighter';
  const lg=g.createLinearGradient(lx-110,0,lx+110,0);lg.addColorStop(0,'rgba(255,225,160,0)');lg.addColorStop(.5,'rgba(255,225,160,'+(.09*lit)+')');lg.addColorStop(1,'rgba(255,225,160,0)');
  g.fillStyle=lg;g.fillRect(P.cx-P.rx,P.cy-P.ry,P.rx*2,P.ry*2);
  // rings
  for(const d of list){const a=t-d.t;if(a<0||a>3.2)continue;
    for(let r=0;r<3;r++){const ar=a-r*.22;if(ar<0)continue;const rad=ar*150*d.s+4,al=Math.pow(1-clamp(ar/3.0),2)*(r?.55:1)*.85;
      g.strokeStyle=`rgba(190,225,240,${al})`;g.lineWidth=3-r*.7;g.beginPath();g.ellipse(P.cx+d.x,P.cy+d.y,rad,rad*.36,0,0,7);g.stroke();
      if(r===0){g.strokeStyle=`rgba(255,235,190,${al*.35})`;g.lineWidth=1.5;g.beginPath();g.ellipse(P.cx+d.x,P.cy+d.y+3,rad,rad*.36,0,0,7);g.stroke()}}
    if(a<.12){g.fillStyle=`rgba(230,245,255,${1-a/.12})`;g.beginPath();g.ellipse(P.cx+d.x,P.cy+d.y,14*d.s,5*d.s,0,0,7);g.fill()}}
  g.restore();g.globalCompositeOperation='source-over';
  g.strokeStyle='rgba(120,150,165,.35)';g.lineWidth=2;g.beginPath();g.ellipse(P.cx,P.cy,P.rx,P.ry,0,0,7);g.stroke();
}
window.frame=function(t){
  g.clearRect(0,0,1080,1920);g.fillStyle='#04070c';g.fillRect(0,0,1080,1920);
  // rain streaks over the upper pool during the downpour
  const l1=ease((t-4.3)/.5)*1;
  pool(P1,t,drops.filter(d=>d.p===1),1);
  if(t>4.5&&t<5.9){const k=clamp((t-4.5)/.3)*(1-clamp((t-5.5)/.4));g.strokeStyle='rgba(190,220,240,'+(.5*k)+')';g.lineWidth=2;
    for(let i=0;i<46;i++){const x=150+H(i)*780,sp=1800+H(i+3)*900,y=((t*sp+H(i+5)*1000)%700)+250;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+55);g.stroke()}}
  // lower pool opens as the second half begins
  g.globalAlpha=ease((t-4.4)/.8);pool(P2,t,drops.filter(d=>d.p===2),1);
  // water level in the lower pool: faint rising band, one drip at a time
  g.globalAlpha=1;
  const up=(id,a,b)=>{const p=ease((t-a)/.8),o=b?1-ease((t-b)/.5):1;$(id).style.opacity=Math.min(p,o);$(id).style.transform=`translateY(${(1-p)*14}px)`};
  up('a1',.4,4.2);up('a2',2.4,4.2);up('l1',4.6);up('l2',5.4);up('b2',7.6);
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
