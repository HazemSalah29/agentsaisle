<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#cdb98f}
#g{position:absolute;inset:0;width:1080px;height:1920px}
svg{position:absolute;inset:0}
.cap{position:absolute;left:110px;width:860px;text-align:center;color:#14282c;font-family:"Baskerville","Georgia",serif;font-weight:600;font-size:60px;line-height:1.22;opacity:0}
.cap em{font-style:italic;color:#7a3a10}
#hd{position:absolute;bottom:250px;left:0;right:0;text-align:center;font-family:Menlo,monospace;font-size:20px;letter-spacing:.2em;color:rgba(20,40,44,.55)}
</style></head>
<body>
<canvas id="g" width="540" height="960"></canvas>
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920">
<defs>
 <radialGradient id="shade" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#0d2a30" stop-opacity="0"/><stop offset=".6" stop-color="#0d2a30" stop-opacity=".18"/><stop offset="1" stop-color="#0d2a30" stop-opacity=".7"/></radialGradient>
 <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset=".55" stop-color="#f0a63e"/><stop offset="1" stop-color="#c8641c"/></linearGradient>
 <pattern id="pat" width="150" height="150" patternUnits="userSpaceOnUse"><rect width="150" height="150" fill="#000"/><path id="star" fill="#fff"/><circle cx="0" cy="0" r="11" fill="#fff"/><circle cx="150" cy="0" r="11" fill="#fff"/><circle cx="0" cy="150" r="11" fill="#fff"/><circle cx="150" cy="150" r="11" fill="#fff"/></pattern>
 <filter id="bl" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
 <filter id="bloom" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="18"/></filter>
 <mask id="mk" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1920"><rect x="-800" y="-800" width="2700" height="3500" id="mr" fill="url(#pat)"/></mask>
 <clipPath id="envc"><rect x="0" y="0" width="1080" height="1920"/></clipPath>
</defs>
<rect width="1080" height="1920" fill="url(#shade)"/>
<g mask="url(#mk)"><rect id="bg" width="1080" height="1920" fill="url(#sun)" opacity=".55" filter="url(#bloom)"/></g>
<g mask="url(#mk)" filter="url(#bl)"><rect id="lt" width="1080" height="1920" fill="url(#sun)" opacity=".82"/></g>
<g id="fg"></g>
</svg>
<div class="cap" id="c1" style="top:430px">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="cap" id="c2" style="top:760px">It is <em>not the biggest one.</em></div>
<div class="cap" id="c3" style="top:1340px;font-size:54px">Same days. <em>One kept going.</em></div>
<div id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
// star tile: 8-point star centred at (75,75)
(()=>{let d='';for(let i=0;i<16;i++){const a=i*Math.PI/8-Math.PI/2,r=i%2?30:60;d+=(i?'L':'M')+(75+r*Math.cos(a)).toFixed(1)+' '+(75+r*Math.sin(a)).toFixed(1)}$('star').setAttribute('d',d+'Z')})();
// baked plaster grain, seeded
(()=>{let s=7;const r=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;const c=$('g').getContext('2d'),W=540,H=960;
 c.fillStyle='#cdb98f';c.fillRect(0,0,W,H);
 for(let i=0;i<70;i++){const x=r()*W,y=r()*H,rad=40+r()*110,g=c.createRadialGradient(x,y,0,x,y,rad),dk=r()<.5;g.addColorStop(0,dk?'rgba(120,98,60,.13)':'rgba(240,226,190,.16)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2)}
 const im=c.getImageData(0,0,W,H),d=im.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*26;d[i]+=n;d[i+1]+=n;d[i+2]+=n}c.putImageData(im,0,0)})();
const INK='#14282c',CRM='#f4ead2',AMB='#f0a63e';
add(.3,'tap',.25);add(2.6,'tap',.25);add(4.5,'bong',.35);add(5.1,'thud',.3);
for(let k=0;k<7;k++){add(5.6+k*.6,'plink',.2)}
add(5.6,'drop',.3);add(7.0,'tap',.25);
function arch(w,h,cx,by){const x0=cx-w/2,x1=cx+w/2,top=by-h;return `M${x0} ${by} V${top+w/2} Q${x0} ${top} ${cx} ${top} Q${x1} ${top} ${x1} ${top+w/2} V${by} Z`}
window.frame=function(t){
  // sun moves: slide, skew and stretch
  const u=t/10,tx=-200+u*300,ty=-160+u*220,sk=-6-u*14,sy=1.5+u*.5,sx=1.45+u*.05;
  const pt=`translate(${tx} ${ty}) skewX(${sk}) scale(${sx} ${sy})`;
  $('pat').setAttribute('patternTransform',pt);
  const o=.35+.65*ease(t/.9);$('lt').setAttribute('opacity',(.82*o).toFixed(3));$('bg').setAttribute('opacity',(.55*o).toFixed(3));
  let s='';
  // arch opens 4.5 -> 5.6 : doorway grows from the floor
  const p=inout((t-4.5)/1.1);
  if(p>0){const h=760*p,cx=540,by=1280,w=600;
    s+=`<path d="${arch(w,Math.max(h,1),cx,by)}" fill="#0f2a30"/>`;
    s+=`<path d="${arch(w,Math.max(h,1),cx,by)}" fill="none" stroke="#7a3a10" stroke-width="6" opacity=".85"/>`;
    if(p>.9){
      const q=ease((t-5.3)/.5),X0=315,DX=75;
      s+=`<g opacity="${q}"><text x="${X0-14}" y="880" font-family="Menlo,monospace" font-size="19" letter-spacing="4" fill="${CRM}" opacity=".75">ONCE</text><text x="${X0-14}" y="1070" font-family="Menlo,monospace" font-size="19" letter-spacing="4" fill="${CRM}" opacity=".75">EVERY DAY</text></g>`;
      for(let k=0;k<7;k++){
        const x=X0+k*DX+10,a=ease((t-(5.6+k*.6))/.4),rin=ease((t-5.4)/.4);
        // top row: one big deed, then nothing
        s+=`<circle cx="${x}" cy="950" r="22" fill="none" stroke="${CRM}" stroke-width="2" opacity="${.28*rin}"/>`;
        s+=`<circle cx="${x}" cy="1140" r="22" fill="none" stroke="${CRM}" stroke-width="2" opacity="${.28*rin}"/>`;
        if(k===0&&a>0){s+=`<circle cx="${x}" cy="950" r="${48*a+ (1-a)*0}" fill="${AMB}" opacity=".25"/><circle cx="${x}" cy="950" r="${26*a}" fill="${AMB}"/>`}
        if(a>0){s+=`<circle cx="${x}" cy="1140" r="${34*a}" fill="${AMB}" opacity=".22"/><circle cx="${x}" cy="1140" r="${15*a}" fill="${AMB}"/>`}
      }
      // faint line stopping vs going
      const g=clamp((t-5.6)/3.8);
      s+=`<path d="M${315+10} 1216 H${315+10+g*450}" stroke="${AMB}" stroke-width="3" stroke-linecap="round" opacity=".7"/>`;
    }
  }
  $('fg').innerHTML=s;
  const up=(id,a,b)=>{const q=ease((t-a)/.6),r=b?1-ease((t-b)/.4):1;$(id).style.opacity=Math.min(q,r);$(id).style.transform=`translateY(${(1-q)*14}px)`};
  up('c1',.3,4.1);up('c2',2.6,4.1);up('c3',7.0);
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
