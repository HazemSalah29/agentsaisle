<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Graphite sketchbook: a pencil study in a spiral sketchbook. Faint construction ellipses first, firm contours over

const nz=makeNoise(23);
const ctx=document.getElementById('c').getContext('2d');
const W=1080,H=1920,PX=74,GR='38,38,44',CX=PX+(W-PX)/2;

// ---- geometry helpers

// ---- the stones: a path of six stepping stones, near to far
const ST=[[CX-120,1010,176],[CX+90,868,144],[CX-90,738,118],[CX+70,624,96],[CX-50,528,76],[CX+36,450,58]].map(([cx,cy,rx],i)=>({cx,cy,rx,ry:rx*.31,d:rx*.2,i}));
const inTop=(s,x,y)=>{const dx=(x-s.cx)/s.rx,dy=(y-s.cy)/s.ry;return dx*dx+dy*dy<1};

  if(inTop(s,x,y))return .1+.5*clamp(dx*.7+dy*.5+.32)+nz.n2(x*.04,y*.04)*.05;

// ---------------------------------------------------------------- baked: desk, paper, tooth
let PAGE=null,TOOTH=null,DESK=null;

  PAGE=layer(W,H);{const c=PAGE.getContext('2d'),base='#efe6d2',br=239,bg=230,bb=210;c.fillStyle=base;c.fillRect(0,0,W,H);const n=makeNoise(31),cell=4;
    for(let y=0;y<H;y+=cell)for(let x=0;x<W;x+=cell){const v=n.fbm2(x*.01,y*.01,3)*.6+n.n2(x*.15,y*.04)*.4,s=1+v*.025*2;c.fillStyle=`rgb(${br*s|0},${bg*s|0},${bb*s|0})`;c.fillRect(x,y,cell,cell)}
    const cur=c.createLinearGradient(PX,0,PX+90,0);cur.addColorStop(0,'rgba(90,70,40,0.28)');cur.addColorStop(1,'rgba(90,70,40,0)');c.fillStyle=cur;c.fillRect(PX,0,90,H);
    const lamp=c.createRadialGradient(560,700,80,640,1000,1400);lamp.addColorStop(0,'rgba(255,250,235,0.18)');lamp.addColorStop(1,'rgba(70,50,20,0.16)');c.fillStyle=lamp;c.fillRect(PX,0,W,H)}
  DESK=layer(W,H);{const c=DESK.getContext('2d'),dk=c.createLinearGradient(0,0,PX,0);dk.addColorStop(0,'#2a2420');dk.addColorStop(1,'#3b332c');c.fillStyle=dk;c.fillRect(0,0,PX+10,H);c.fillStyle='rgba(0,0,0,0.35)';c.fillRect(PX-6,0,10,H)}

    const td=tx.getImageData(0,0,W,H).data,r2=rng(6);for(let i=0,j=0;i<TOOTH.length;i++,j+=4)TOOTH[i]=td[j]/255*.65+r2()*.35}
}
const L=layer(W,H),g=L.getContext('2d'),S=layer(W,H),sm_=S.getContext('2d');
let TIP=null;

// the word, written with the pen mask right to left in graphite (body first, marks after)
const strip=s=>s.replace(/[ً-ٰٟ]/g,'');
function arabic(str,cx,y,size,t0,t1,t){

  const pr=win(t,t0,t1);if(pr<=0)return;g.save();g.font=font;const tw=g.measureText(str).width;if(align==='c')x-=tw/2;g.translate(x,y);g.rotate(rot);const rr=rng(seed);let px=0;const nCh=Math.ceil(str.length*pr);
  if(nCh<str.length)TIP=[x+Math.cos(rot)*g.measureText(str.slice(0,nCh)).width,y+Math.sin(rot)*g.measureText(str.slice(0,nCh)).width-8];
  let ci=0;for(const ch of str){if(ci++>=nCh)break;const w=g.measureText(ch).width;g.fillStyle=`rgba(${GR},${a*rr.range(.85,1.05)})`;g.save();g.translate(px,rr.range(-1,1));g.rotate(rr.range(-.03,.03));g.fillText(ch,0,0);g.fillText(ch,.7,.5);g.restore();px+=w}g.restore()}
const AR='وَلْيَتَلَطَّفْ';
let READY=false;
window.frame=function(t){

     sm_.save();sm_.beginPath();sm_.ellipse(s.cx,s.cy,s.rx,s.ry,0,0,7);sm_.clip();const tg=sm_.createRadialGradient(s.cx-s.rx*.4,s.cy-s.ry*.4,s.ry*.2,s.cx+s.rx*.2,s.cy+s.ry*.2,s.rx*1.1);tg.addColorStop(0,`rgba(${GR},0)`);tg.addColorStop(.6,`rgba(${GR},0.1)`);tg.addColorStop(1,`rgba(${GR},0.3)`);sm_.fillStyle=tg;sm_.fillRect(s.cx-s.rx,s.cy-s.ry,s.rx*2,s.ry*2);sm_.restore();
