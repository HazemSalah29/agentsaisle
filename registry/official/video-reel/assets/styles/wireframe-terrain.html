// ---------------------------------------------------------------- canvas and finishing layers

// ---------------------------------------------------------------- the wire crescent: a pillow-thick crescent (outer circle minus a bite), two sheets meeting at the edge, hidden-line by painter's order

const MOON={pos:[pathX(150)+6,33,152],R:22};

// ---------------------------------------------------------------- a small lantern, hidden-line (cube + pyramid roof), planted on the route
