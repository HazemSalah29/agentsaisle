<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Scheherazade;src:url(../ScheherazadeNew-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#d8d1c0}
#table{position:absolute;inset:0;background:#d8d1c0}
#sheet{position:absolute;left:60px;top:110px;width:960px;height:1700px;background:#f1e8d6;transform:rotate(-.8deg);box-shadow:0 10px 40px rgba(80,60,40,.25),0 2px 6px rgba(80,60,40,.2);
  background-image:radial-gradient(circle,#c9bda3 2.2px,transparent 2.6px);background-size:60px 60px;background-position:30px 30px}
#grain{position:absolute;inset:0;mix-blend-mode:multiply;opacity:.5;pointer-events:none}
.o{position:absolute;opacity:0}
.hand{font-family:"Bradley Hand","Snell Roundhand","Noteworthy","Segoe Print",cursive;color:#6b5a6e}
.tape{position:absolute;height:74px;opacity:.88;box-shadow:0 1px 3px rgba(80,60,40,.25);
  clip-path:polygon(0 8%,3% 0,6% 10%,9% 0,100% 0,97% 12%,100% 25%,97% 38%,100% 50%,97% 63%,100% 75%,97% 88%,100% 100%,9% 100%,6% 90%,3% 100%,0 92%,3% 80%,0 66%,3% 50%,0 33%,3% 20%)}
#label{left:150px;top:640px;width:780px;height:270px;background:#fbf6ea;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(80,60,40,.22);clip-path:polygon(0 3%,4% 0,9% 4%,15% 0,22% 3%,30% 0,38% 4%,46% 0,55% 3%,63% 0,72% 4%,80% 0,89% 3%,95% 0,100% 4%,100% 96%,95% 100%,88% 96%,80% 100%,70% 96%,61% 100%,52% 96%,42% 100%,33% 96%,24% 100%,15% 96%,7% 100%,0 96%)}
#ar{font-family:Scheherazade,serif;font-size:128px;line-height:1.7;color:#3f2c45;direction:rtl;white-space:nowrap}
#en{left:0;width:1080px;text-align:center;top:1010px;font-size:76px;color:#5a4560}
#cit{left:290px;top:1195px;width:500px;height:62px;background:#fbf6ea;font-family:"Courier New",Courier,monospace;font-size:26px;letter-spacing:7px;color:#6b5a6e;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(80,60,40,.2);transform:rotate(1.2deg)}
#note{left:0;width:1080px;text-align:center;top:330px;font-size:56px;line-height:1.3;padding:0 140px;transform-origin:center}
#close{left:0;width:1080px;text-align:center;top:1290px;font-size:56px;padding:0 140px;line-height:1.25}
#hd{position:absolute;left:260px;top:1400px;width:380px;font-family:"Courier New",Courier,monospace;font-size:28px;letter-spacing:6px;color:#4a3a4c;text-align:center;line-height:74px;opacity:0}
svg.f{position:absolute;overflow:visible;opacity:0}
</style></head>
<body>
<div id="table"></div>
<div id="sheet"></div>
<div class="tape" id="tp1" style="left:30px;top:200px;width:300px;transform:rotate(-34deg);background:repeating-linear-gradient(90deg,#dba3a6 0 18px,#e8bec0 18px 36px)"></div>
<div class="tape" id="tp2" style="left:760px;top:130px;width:300px;transform:rotate(18deg);background:repeating-linear-gradient(45deg,#a8b896 0 14px,#bcc9ab 14px 28px)"></div>
<div id="note" class="o hand">A few young men wake up in a cave, hungry. One is sent to the city with one instruction.</div>
<svg id="fl" class="f" width="322" height="532" viewBox="0 0 460 760" style="left:700px;top:1420px"></svg>
<div id="label" class="o"><div id="ar">وَلْيَتَلَطَّفْ</div></div>
<div class="tape" id="tp3" style="left:130px;top:610px;width:150px;height:56px;transform:rotate(-38deg);background:#dba3a6;opacity:0"></div>
<div class="tape" id="tp4" style="left:800px;top:870px;width:150px;height:56px;transform:rotate(-38deg);background:#a8b896;opacity:0"></div>
<div id="en" class="o hand">and let him be cautious.</div>
<svg id="ul" class="o" width="760" height="40" viewBox="0 0 760 40" style="left:160px;top:1115px"><path id="ulp" d="M4 22 C120 8 260 32 390 16 S640 26 756 12" fill="none" stroke="#c7838f" stroke-width="5" stroke-linecap="round"/></svg>
<div id="cit" class="o">QURAN 18:19</div>
<div id="close" class="o hand">Gentle, even in a hard moment.</div>
<div class="tape" id="tp5" style="left:260px;top:1400px;width:380px;background:#e5d2a0;opacity:0"></div>
<div id="hd">@YOURPAGE</div>
<svg id="grain" viewBox="0 0 1080 1920" width="1080" height="1920"><defs><filter id="g" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .32  0 0 0 -3 1.6"/></filter></defs><rect width="1080" height="1920" filter="url(#g)"/></svg>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
add(.3,'tap',.25);add(1.0,'slide',.25);add(1.8,'slide',.3);add(2.9,'thud',.3);add(3.2,'tap',.25);add(3.5,'slide',.25);add(5.0,'tap',.25);add(6.4,'slide',.3);add(7.4,'tap',.25);add(8.3,'tap',.25);add(8.7,'bell',.25);
// pressed flower: translucent petals with veins, a thin stem and leaf, drawn once
(function(){
  let s='<g transform="translate(230 230)">';
  for(let i=0;i<6;i++){const a=i*60;s+=`<g transform="rotate(${a})"><path d="M0 0 C-48 -50 -42 -150 0 -190 C42 -150 48 -50 0 0Z" fill="#d9a1a8" fill-opacity=".62" stroke="#b77683" stroke-opacity=".6" stroke-width="2"/><path d="M0 -10 L0 -165 M0 -60 L-18 -100 M0 -60 L18 -100" stroke="#b77683" stroke-opacity=".5" stroke-width="1.6" fill="none"/></g>`;}
  s+='<circle r="34" fill="#e8cf86" fill-opacity=".9"/><circle r="34" fill="none" stroke="#b79a52" stroke-width="2" stroke-dasharray="3 5"/></g>';
  s+='<path d="M230 260 C250 400 200 540 215 740" fill="none" stroke="#8a9a6e" stroke-width="6" stroke-linecap="round" stroke-opacity=".85"/>';
  s+='<path d="M222 520 C150 480 120 520 110 560 C160 580 200 560 222 520Z" fill="#a8b896" fill-opacity=".75" stroke="#7e8f66" stroke-width="2"/>';
  $('fl').innerHTML=s;
})();
window.frame=function(t){
  const f=Math.floor(t*12)/12; // stop-motion: things move on twos
  const put=(el,t0,dur=.35)=>{const p=ease((f-t0)/dur);el.style.opacity=f>=t0?1:0;return p;};
  // washi tapes go on first
  let p=put($('tp1'),.2);$('tp1').style.transform=`rotate(-34deg) translateY(${(1-p)*-60}px)`;
  p=put($('tp2'),.5);$('tp2').style.transform=`rotate(18deg) translateY(${(1-p)*-60}px)`;
  // handwritten opener
  p=put($('note'),1.0,.5);$('note').style.transform=`rotate(-1.5deg) translateY(${(1-p)*14}px)`;$('note').style.opacity=f>=1.0?(f>6.2?Math.max(0,1-(f-6.2)/.5):1):0;
  // pressed flower is laid down, tilts a little as it lands
  p=ease((f-1.8)/.9);$('fl').style.opacity=f>=1.8?1:0;
  $('fl').style.transform=`translate(${(1-p)*60}px,${(1-p)*-380}px) rotate(${14-p*14+Math.sin(f*1.4)*(1-p)*8}deg) scale(${1.12-.12*p})`;
  $('fl').style.filter=`drop-shadow(${3*p}px ${5*p}px ${4*p}px rgba(80,60,40,.25))`;
  // label slips in, tapes pin it
  p=put($('label'),3.0,.4);$('label').style.transform=`rotate(${-1.2}deg) translateY(${(1-p)*30}px)`;
  put($('tp3'),3.4);put($('tp4'),3.5);
  // Arabic: written right to left, in a few steps
  const pen=clamp((f-3.5)/1.1),ar=$('ar');ar.style.clipPath=`inset(-30% 0 -30% ${(1-inout(pen))*100}%)`;
  p=put($('en'),5.0,.4);$('en').style.transform=`rotate(-1deg) translateY(${(1-p)*12}px)`;
  // hand-drawn underline under the English
  const u=clamp((f-6.0)/.8);$('ul').style.opacity=u>0?1:0;$('ulp').style.strokeDasharray=800;$('ulp').style.strokeDashoffset=800*(1-inout(u));
  p=put($('cit'),5.6,.3);
  p=put($('close'),7.4,.5);$('close').style.transform=`rotate(.8deg) translateY(${(1-p)*14}px)`;
  put($('tp5'),8.3);$('hd').style.opacity=f>=8.5?1:0;
  return {};
};
document.fonts.load('128px Scheherazade','وَلْيَتَلَطَّفْ').then(()=>document.fonts.ready).then(()=>{frame(0);window.ready=true});
</script></body></html>
