<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1080">
<!-- Graphic slide contract: art in #art (canvas or SVG, full slide), text in .safe (readable backing).
     Copy this file to slides/NN.html, draw the art, write the text. Set the slide size below to the deck size
     (3:4 = 1080x1440, 4:5 = 1080x1350, 1:1 = 1080x1080). -->
<!-- Arabic: use Scheherazade New, never Amiri (it drops dots in Chrome). Add inside <style>:
     @font-face{font-family:"Scheherazade New";src:url("file:///<path to>/ScheherazadeNew-Regular.ttf")}
     The file is in the engine assets (video-reel/assets/ on desktop, .engine/assets/ in chat). -->
<style>
:root{--bg:#10151c;--ink:#f4f1ea;--accent:#e8b04a;--w:1080px;--h:1440px}
*{box-sizing:border-box;margin:0}
html,body{width:var(--w);height:var(--h);overflow:hidden;background:var(--bg);color:var(--ink)}
body{position:relative;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
#art{position:absolute;inset:0;width:100%;height:100%}
.safe{position:absolute;left:72px;right:72px;bottom:72px;max-height:40%;overflow:hidden;
  padding:40px 44px;border-radius:28px;background:rgba(16,21,28,.82);font-size:54px;line-height:1.3;font-weight:600}
.ar{font-family:"Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;text-align:right;line-height:1.8}
</style></head><body>
<svg id="art" viewBox="0 0 1080 1440" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!-- draw the art here -->
</svg>
<div class="safe" id="safe">Your text here.</div>
<script>
window.overflow=false;
(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){
  var s=document.getElementById('safe');
  window.overflow=s.scrollHeight>s.clientHeight+1;
  window.ready=true;
});
</script></body></html>
