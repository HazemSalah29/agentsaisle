<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width={{W}}">
<style>
{{FONTFACE}}
:root{--bg:{{BG}};--ink:{{INK}};--accent:{{ACCENT}}}
*{box-sizing:border-box;margin:0}
html,body{width:{{W}}px;height:{{H}}px;overflow:hidden;background:var(--bg);color:var(--ink)}
body{font-family:{{FONT_BODY}},-apple-system,"Helvetica Neue",Arial,sans-serif;padding:96px}
.safe{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center}
.txt{max-height:100%;overflow:hidden;font-size:58px;line-height:1.35;font-weight:500}
.txt p{margin:0 0 .7em}
.txt p:last-child{margin-bottom:0}
span[lang=ar]{font-family:"Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;font-size:1.15em}
.ar{font-family:"Scheherazade New","Geeza Pro","Noto Naskh Arabic",serif;font-size:1.25em;line-height:1.8;text-align:right}
</style></head><body>
<div class="safe"><div class="txt" id="txt">{{TEXT}}</div></div>
<script>
window.overflow=false;
(document.fonts?document.fonts.ready:Promise.resolve()).then(function(){
  var t=document.getElementById('txt');
  window.overflow=t.scrollHeight>t.clientHeight+1;
  window.ready=true;
});
</script></body></html>
