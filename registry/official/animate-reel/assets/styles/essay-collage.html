const tape=(c,x,y,w,h,rot,seed)=>{const r=rng(seed);c.save();c.translate(x,y);c.rotate(rot);const p=[],n=7;p.push([-w/2,-h/2]);p.push([w/2,-h/2]);
 for(let i=1;i<n;i++)p.push([w/2+(i%2?3:-2)+(r()-.5)*3,-h/2+h*i/n]);p.push([w/2,h/2]);p.push([-w/2,h/2]);for(let i=n-1;i>0;i--)p.push([-w/2+(i%2?-3:2)+(r()-.5)*3,-h/2+h*i/n]);
 c.shadowColor='rgba(40,28,15,.22)';c.shadowBlur=3;c.shadowOffsetY=1.5;pathPoly(c,p);c.fillStyle='rgba(228,216,186,.8)';c.fill();c.shadowColor='transparent';
 c.clip();c.strokeStyle='rgba(255,255,255,.22)';c.lineWidth=1;for(let i=0;i<5;i++){const yy=-h/2+r()*h;c.beginPath();c.moveTo(-w/2,yy);c.lineTo(w/2,yy+(r()-.5)*2);c.stroke()}

const inkArrow=(c,pts,prog,lw=3,col=INK,dash=[10,8])=>{if(prog<=0)return;c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.setLineDash(dash);c.beginPath();const n=Math.max(1,Math.floor((pts.length-1)*prog));for(let i=0;i<=n;i++)i?c.lineTo(pts[i][0],pts[i][1]):c.moveTo(pts[i][0],pts[i][1]);c.stroke();c.restore()};
// ---------- camera + stepped cutout animation
const place=(c,cam,p,x,y,rot,s,fn)=>{c.save();c.translate(540,960);const k=Math.pow(cam.z,p);c.scale(k,k);c.translate(-cam.x*p,-cam.y*p);c.translate(x-540,y-960);if(rot)c.rotate(rot);if(s!==1)c.scale(s,s);fn(c);c.restore()};
const POP={drop:{s:[1.16,1.05,.985,1],r:[.05,.015,-.006,0]},slideL:{dx:[-300,-110,-26,0],r:[-.04,-.015,.004,0]},slideR:{dx:[300,110,26,0],r:[.04,.015,-.004,0]},slideU:{dy:[320,120,28,0],r:[.03,.01,-.003,0]}};
const arrive=(tq,a,kind='drop')=>{if(tq<a-1e-6)return null;const f=Math.min(3,Math.round((tq-a)*12)),P=POP[kind];return{s:P.s?P.s[f]:1,r:P.r[f],dx:P.dx?P.dx[f]:0,dy:P.dy?P.dy[f]:0}};
const putSpr=(c,cam,p,spr,x,y,rot,s,tq,a,kind,extra)=>{const A=arrive(tq,a,kind);if(!A)return false;place(c,cam,p,x+A.dx,y+A.dy,rot+A.r,s*A.s,cc=>{drawSpr(cc,spr);if(extra)extra(cc)});return true};
const bgPaper=(c,cam,tint)=>{c.save();c.fillStyle=tint||PAPER;c.fillRect(0,0,W,H_);c.restore();place(c,cam,.2,540,960,0,1,cc=>{cc.globalCompositeOperation='multiply';for(let k=-1;k<=2;k++)cc.drawImage(fibre(),-FW/2,-FH/2+k*FH)})};
const block=(c,cam,p,x,y,w,h,rot,col,seed,torn=[0,0,0,0],amp=6)=>{place(c,cam,p,x,y,rot,1,cc=>{const poly=edgePoly(w,h,torn,seed,amp);cc.save();cc.shadowColor='rgba(40,28,15,.25)';cc.shadowBlur=10;cc.shadowOffsetY=4;pathPoly(cc,poly);cc.fillStyle=col;cc.fill();cc.restore();texture(cc,poly,.55,seed*40%300,0)})};
const finish=(c,t,vig=.32)=>{const pats=grainTiles(),f=Math.floor(t*12),r=rng(5000+f);c.save();c.globalCompositeOperation='overlay';c.globalAlpha=.26;c.fillStyle=pats[f%4];c.translate(-r()*256,-r()*256);c.fillRect(0,0,W+256,H_+256);c.restore();
 c.save();c.globalCompositeOperation='multiply';const g=c.createRadialGradient(540,960,420,540,960,1300);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,`rgba(${255-90*vig},${255-100*vig},${255-120*vig},1)`);c.fillStyle=g;c.fillRect(0,0,W,H_);c.restore()};
// Arabic written with the pen: body without the vowel marks (each word centred where it sits in the full line), then the full line
function bodyWords(c,str,cx,y){const words=str.split(' '),w=c.measureText(str).width,R0=cx+w/2;c.save();c.textAlign='center';
 for(let i=0;i<words.length;i++){const wi=c.measureText(words.slice(0,i+1).join(' ')).width,ww=c.measureText(words[i]).width;c.fillText(words[i].replace(HAR,''),R0-wi+ww/2,y)}c.restore()}
function arabicPen(c,str,cx,y,size,u,marks,col){if(u<=0)return;c.save();c.direction='rtl';c.textAlign='center';c.textBaseline='alphabetic';c.font=size+'px ScheherazadeG';c.fillStyle=col;
 const w=c.measureText(str).width,R=cx+w/2+20,L=cx-w/2-20,fx=R-(R-L)*u;
 c.save();c.beginPath();c.moveTo(fx,y-size*1.3);c.lineTo(R+24,y-size*1.3);c.lineTo(R+24,y+size);c.lineTo(fx-20,y+size);c.closePath();c.clip();c.globalAlpha*=1-Math.min(1,Math.max(0,marks||0));bodyWords(c,str,cx,y);c.restore();
 if(marks>0){c.globalAlpha=marks;c.fillText(str,cx,y)}c.restore()}

// ---------- sprites, built once
const init=()=>{if(C.ready)return;C.ready=true;fibre();grainTiles();
 const TH=[photoMoon,photoLantern,photoPalm,photoArch];
 C.thumbs=TH.map((f,i)=>makePrint(treat(150,150,20+i,f,{cell:3.4,blur:.8,con:1.3}),30+i,[1,1,1,1],8,4));
 C.big=treat(320,240,7,photoMoon,{cell:3.8,blur:1,con:1.3});C.halves=tearHalves(C.big,17);
 C.sc1=makePrint(treat(190,170,41,photoLantern,{cell:3.8,blur:.9,con:1.3}),43,[0,1,0,0],10,7);
 C.sc2=makePrint(treat(190,170,42,photoPalm,{cell:3.8,blur:.9,con:1.3}),47,[0,0,0,1],10,7);
 C.s1=makeStrip('SOULS ARE LIKE',`400 118px ${IMPACT}`,{bg:INK,fg:'#f3efe5',seed:3,ls:'3px'});
 C.s2=makeStrip('GATHERED TROOPS.',`400 118px ${IMPACT}`,{seed:4,hl:'GATHERED TROOPS.',ls:'3px'});
 C.cite=makeStrip('SAHIH MUSLIM 2638',`400 40px ${COND}`,{bg:INK,fg:'#f3efe5',seed:9,ls:'9px',padX:26,padY:12});
 C.arPaper=makePaper(900,450,41,'THE RECORD  ·  SOULS',NEWS,[0,1,1,1]);
 C.enPaper=makePaper(930,385,51,'',CARD,[1,0,1,0]);
};

// ---- English card text (live): lines and the two highlighted phrases
const EN=[['Those that knew each other',0],['are drawn together,',0],['and those that did not,',1],['drift apart.',1]];
const ENF=`700 58px ${SERIF}`;
const HLP={1:'drawn together',3:'drift apart'};

window.frame=function(t){
 init();
 const tq=q12(t);
 const pan=inOut(win(t,2.85,3.4));
 const cam={x:0,y:1920*pan,z:1+.05*win(t,0,10)};
 const speed=Math.abs(1920*(inOut(win(t+.02,2.85,3.4))-inOut(win(t-.02,2.85,3.4)))/.04);
 const draw=c=>{
  bgPaper(c,cam,PAPER);
  const YB=1920;
  // ======== scene A: gathered troops ========
  block(c,cam,.8,350,560,540,360,-.06,RED,5,[0,0,0,0],5);
  block(c,cam,.8,640,1000,960,640,.025,KRAFT,8,[1,1,1,1],8);
  place(c,cam,.8,170,720,-.5,1,cc=>tape(cc,0,0,120,36,0,3));place(c,cam,.8,1110,720,.5,1,cc=>tape(cc,0,0,120,36,0,4));
  putSpr(c,cam,1,C.s1,520,390,-.022,1,tq,.3,'slideL');
  putSpr(c,cam,1,C.s2,560,540,.014,1,tq,.8,'slideR',cc=>hilite(cc,C.s2.hl,win(t,1.5,2.1),11));
  // fifteen small prints gather into ranks (each hops on twos)
  {const r=rng(77);
   for(let i=0;i<15;i++){const col=i%5,row=Math.floor(i/5),ex=540+(col-2)*176,ey=830+row*188,t0=1.05+i*.1,u=win(tq,t0,t0+.55);
    const sx=ex+r.range(-640,640),sy=ey+r.range(-420,380),sr=r.range(-.7,.7);if(tq<t0-1e-6){r();continue}
    const k=eOut(u),pr=eOut(win(tq,t0,t0+.6));
    const jitter=((i*7)%5-2)*.006*(1-u);
    place(c,cam,1,lerp(sx,ex,k),lerp(sy,ey,k),lerp(sr,jitter,k),1,cc=>drawSpr(cc,C.thumbs[i%4]));void pr}}
  // ======== scene B: the saying, the pairs ========
  const P=1.2,yb=YB*P;
  block(c,cam,P,180,360+yb,520,380,.05,RED,12,[0,0,0,0],5);
  block(c,cam,P,880,1280+yb,560,420,-.04,KRAFT,15,[1,1,0,1],7);
  // Arabic on a clipping, pen-written
  putSpr(c,cam,1,C.arPaper,540,YB+480,-.012,1,tq,3.45,'slideU',cc=>{
   const u=[win(t,3.7,4.25),win(t,4.25,4.8),win(t,4.8,5.35)],mk=win(t,5.35,5.65);
   for(let i=0;i<3;i++)arabicPen(cc,AL[i],0,-52+i*116,76,u[i],mk,INK);
  });
  // the English meaning, with the yellow highlighter
  putSpr(c,cam,1,C.enPaper,540,YB+920,.008,1,tq,4.8,'slideU',cc=>{
   cc.font=ENF;cc.textAlign='left';cc.textBaseline='alphabetic';cc.fillStyle=INK;
   const line=(i,t0)=>{const[s]=EN[i],y=-88+i*80+(i>1?12:0),w=measure(ENF,s).width,u=win(t,t0,t0+.45);if(u<=0)return;const hlw=HLP[i]?measure(ENF,HLP[i]):null;
    const x0=-w/2;cc.save();cc.globalAlpha=u;cc.translate(0,(1-u)*10);cc.fillText(s,x0,y);cc.restore();
    if(HLP[i]){const k=s.indexOf(HLP[i]),px=x0+measure(ENF,s.slice(0,k)).width;hilite(cc,[px-6,y-47,hlw.width+12,60],win(t,i===1?5.55:7.05,i===1?6.05:7.55),i*3+1)}};
   line(0,4.95);line(1,5.15);line(2,6.15);line(3,6.35)});
  putSpr(c,cam,1,C.cite,540,YB+1152,-.01,1,tq,7.2,'drop');
  // the two that fit: one print torn in two, the halves slide together and are taped
  {const gap=lerp(150,0,inOut(win(tq,5.15,5.75)));const H=C.halves;
   if(tq>=5.0-1e-6){place(c,cam,1,300-gap,YB+1352,-.02,1,cc=>drawSpr(cc,H.L));place(c,cam,1,300+gap,YB+1352,-.02,1,cc=>drawSpr(cc,H.R));
    if(tq>=5.7)place(c,cam,1,300,YB+1352,-.02,1,cc=>{tape(cc,-6,-100,86,30,.12,6);tape(cc,8,100,86,30,-.1,7)})}}
  // the two that do not: mismatched edges drift apart, with thin ink routes
  {const u=inOut(win(tq,6.5,9.6)),g=lerp(10,150,u);
   if(tq>=6.2-1e-6){place(c,cam,1,780-g,YB+1352+u*8,-.03-u*.1,1,cc=>drawSpr(cc,C.sc1));place(c,cam,1,780+g,YB+1352-u*8,.03+u*.12,1,cc=>drawSpr(cc,C.sc2));
    place(c,cam,1,780,YB+1352,0,1,cc=>{inkArrow(cc,[[-26,-118],[-70,-134],[-120,-128]],win(t,7.6,8.1));inkArrow(cc,[[26,-118],[70,-134],[120,-128]],win(t,7.6,8.1))})}}
 };
 // the camera whip is blurred along its travel
 if(speed>2500){const n=16,sp=clamp(speed/9000,.2,1)*60;ctx.save();ctx.globalAlpha=1;draw(ctx);const snap=layer(W,H_),sc=snap.getContext('2d');sc.drawImage(cv,0,0);
  ctx.clearRect(0,0,W,H_);for(let i=0;i<n;i++){ctx.globalAlpha=1/(i+1);ctx.drawImage(snap,0,(i/(n-1)-.5)*sp)}ctx.restore()}
 else draw(ctx);
 finish(ctx,t);
 return{};
};
document.fonts.load('78px ScheherazadeG','الأَرْوَاحُ').then(()=>document.fonts.ready).then(()=>{frame(0);window.ready=true});
</script></body></html>
