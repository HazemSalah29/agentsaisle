<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#03121a}
canvas{position:absolute;inset:0;width:1080px;height:1920px}
.txt{position:absolute;left:100px;right:100px;text-align:center;color:#f6efe2;font-family:Baskerville,Georgia,serif;font-size:52px;line-height:1.3;opacity:0;text-shadow:0 2px 24px rgba(0,10,16,.85)}
.am{color:#f0b862;font-style:italic}
#hd{position:absolute;bottom:250px;left:0;right:0;text-align:center;font-family:Baskerville,serif;font-size:22px;letter-spacing:.2em;color:rgba(246,239,226,.6)}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="txt" id="a1" style="top:330px">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="txt am" id="a2" style="top:540px">It is not the biggest one.</div>
<div class="txt am" id="b1" style="top:300px">a small one, every day</div>
<div class="txt" id="b2" style="top:300px">Same days. One kept going.</div>
<div id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
// scene A (0-4.6): one drop blooms. Scene B (4.8-10): top pool one big splash, bottom pool a small drop each day.
const DAYS=[];for(let k=0;k<8;k++)DAYS.push({t:5.5+k*.55,x:.12+((k*0.37)%0.76),y:.25+((k*0.53)%0.5)});
add(.3,'bong',.35);add(.7,'drop',.3);add(2.6,'drop',.18);add(4.9,'bong',.3);add(5.1,'drop',.4);
DAYS.forEach(d=>add(d.t,'plink',.2));add(6.2,'drop',.18);add(9.0,'bell',.25);
const FS=`precision highp float;
uniform vec2 R;uniform float T;uniform float scene;uniform vec4 D[10];uniform float tint;uniform float fade;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return s;}
vec3 dye(vec2 uv,float asp,float kind){
  vec2 p=vec2(uv.x*asp,uv.y);
  vec2 q=vec2(fbm(p*2.6+vec2(0,T*.05)),fbm(p*2.6+vec2(5.2,1.3)-T*.04));
  vec2 r=vec2(fbm(p*2.6+3.*q+vec2(1.7,9.2)+T*.07),fbm(p*2.6+3.*q+vec2(8.3,2.8)-T*.06));
  float f=fbm(p*2.2+3.2*r);
  float c=0.;
  for(int i=0;i<10;i++){
    vec4 d=D[i];
    if(d.w<0.5)continue;
    float age=d.z;
    float grow=1.-exp(-age*(kind>1.5?.9:1.1));
    float rad=(kind>1.5?.04:.05)+grow*(kind>1.5?.62:.16)*d.w;
    vec2 cen=vec2(d.x*asp,d.y);
    float dist=length(p-cen+(r-.5)*.5*grow-(q-.5)*.12);
    float m=smoothstep(rad,rad*.25,dist+ (f-.5)*.18*grow);
    float s=kind>1.5?exp(-age*.55):1.-.07*clamp(age,0.,3.);
    if(kind>2.5)s=exp(-age*.03);
    c+=m*s*(.6+.7*f)*d.w;
  }
  c+=tint*(.15+.7*f)*step(2.5,kind);
  vec3 base=mix(vec3(.012,.07,.09),vec3(.03,.2,.24),f*.9+.1*uv.y);
  vec3 amber=vec3(.95,.62,.2),rose=vec3(.85,.28,.42);
  vec3 col=mix(amber,rose,clamp(r.x*1.3+uv.y*.3-.2,0.,1.));
  return mix(base,col,clamp(c,0.,1.));
}
void main(){
  vec2 fc=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);
  vec3 col=vec3(.012,.07,.09);
  if(scene<.5){
    vec2 uv=fc/R;col=dye(uv,R.x/R.y,1.);
    // light vignette so text reads
    col*=1.-.55*smoothstep(.45,1.,length((uv-.5)*vec2(1.,.62)));
  }else{
    vec2 A0=vec2(40.,480.),sz=vec2(1000.,440.);
    vec2 B0=vec2(40.,960.);
    float inA=step(A0.x,fc.x)*step(fc.x,A0.x+sz.x)*step(A0.y,fc.y)*step(fc.y,A0.y+sz.y);
    float inB=step(B0.x,fc.x)*step(fc.x,B0.x+sz.x)*step(B0.y,fc.y)*step(fc.y,B0.y+sz.y);
    float asp=sz.x/sz.y;
    vec3 bg=vec3(.012,.05,.07);col=bg;
    if(inA>.5)col=dye((fc-A0)/sz,asp,2.);
    if(inB>.5)col=dye((fc-B0)/sz,asp,3.);
    float edge=0.;
    vec2 e=min(abs(fc-A0),abs(fc-A0-sz));edge=max(edge,inA*step(min(e.x,e.y),2.));
    e=min(abs(fc-B0),abs(fc-B0-sz));edge=max(edge,inB*step(min(e.x,e.y),2.));
    col=mix(col,vec3(.94,.9,.8),edge*.35);
  }
  // grain
  col+=(h(gl_FragCoord.xy+floor(T*12.)*7.3)-.5)*.045;
  col*=1.-fade;
  gl_FragColor=vec4(col,1.);
}`;
const cv=$('c'),gl=cv.getContext('webgl',{preserveDrawingBuffer:true,antialias:false});
function sh(t,s){const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const U=k=>gl.getUniformLocation(pr,k);
function draw(t,scene,drops,tint,fade){
  gl.viewport(0,0,1080,1920);gl.uniform2f(U('R'),1080,1920);gl.uniform1f(U('T'),t);gl.uniform1f(U('scene'),scene);gl.uniform1f(U('tint'),tint);gl.uniform1f(U('fade'),fade);
  const a=new Float32Array(40);drops.forEach((d,i)=>a.set(d,i*4));gl.uniform4fv(U('D[0]'),a);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
// drops are [x,y,age,weight] (weight 0 = off). Scene A: one drop. Scene B: A's splash is slot 0 of the shared array only for the top pool, so B uses a second draw call region via tint trick: both pools read the same array.
window.frame=function(t){
  gl.disable(gl.SCISSOR_TEST);gl.clearColor(.012,.05,.07,1);gl.clear(gl.COLOR_BUFFER_BIT);
  const up=(id,a,b)=>{const p=ease((t-a)/.8),o=b?1-ease((t-b)/.5):1;$(id).style.opacity=Math.min(p,o);$(id).style.transform=`translateY(${(1-p)*14}px)`};
  up('a1',.4,4.2);up('a2',2.5,4.2);up('b1',5.8,8.6);up('b2',8.9);
  if(t<4.7){
    const age=Math.max(0,t-.6);
    draw(t,0,[[.5,.42,age,t>=.6?1:0]],0,clamp((t-4.1)/.5));
  }else{
    // slot 0: the big splash (top pool). Slots 1-8: the daily drops (bottom pool). Each pool ignores nothing, so use separate passes by scissor.
    const sp=[[.5,.5,Math.max(0,t-5.0),t>=5?1:0]];
    gl.enable(gl.SCISSOR_TEST);
    gl.scissor(0,1920-920,1080,440); // top pool region (GL origin bottom-left)
    draw(t,1,sp.concat(Array(9).fill([0,0,0,0])),0,clamp(1-(t-4.7)/.5));
    const dd=DAYS.map(d=>[d.x,d.y,Math.max(0,t-d.t),t>=d.t?1:0]);
    const tint=DAYS.reduce((s,d)=>s+(t>=d.t?clamp((t-d.t)/2)*.1:0),0);
    gl.scissor(0,1920-1400,1080,440);
    draw(t,1,dd.concat([[0,0,0,0],[0,0,0,0]]),tint,clamp(1-(t-4.7)/.5));
    gl.disable(gl.SCISSOR_TEST);
  }
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
