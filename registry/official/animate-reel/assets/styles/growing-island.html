<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#bfe3e0}
canvas{position:absolute;inset:0}
.tx{position:absolute;left:50%;width:max-content;max-width:880px;text-align:center;color:#faf4e8;font-family:"Avenir Next",sans-serif;font-weight:600;font-size:64px;line-height:1.22;background:rgba(30,34,72,.58);border-radius:34px;padding:22px 34px;opacity:0}
.tx em{font-style:normal;color:#ffc66b}
.lb{position:absolute;left:50%;width:max-content;text-align:center;color:#faf4e8;font-family:Menlo,monospace;letter-spacing:.16em;background:rgba(30,34,72,.58);border-radius:24px;padding:12px 26px;opacity:0}
</style></head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div class="tx" id="c1">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="tx" id="c2"><em>not the biggest one.</em></div>
<div class="tx" id="c3"><div id="c3a">Same nights.</div><div id="c3b"><em>One kept going.</em></div></div>
<div class="lb" id="ci" style="font-size:40px;color:#ffc66b">SAHIH AL-BUKHARI 6464</div>
<div class="lb" id="hd" style="font-size:44px">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=(x,s)=>{x=clamp(x);const c3=s+1;return 1+c3*Math.pow(x-1,3)+s*Math.pow(x-1,2)}; // back.out, 0..1 with overshoot
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
add(.5,'tap',.25);add(2.2,'wood',.3);add(4.7,'plink',.3);add(7.0,'glass',.3);add(8.4,'bell',.22);
// seeded rng
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261025);
// colours
const H=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const M=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t),RGB=a=>'rgb('+a.map(Math.round)+')';
const WHITE=H('#ffffff'),NIGHT=H('#3b3578'),SHD_DAY=H('#6f6a93'),SHD_NIGHT=H('#2c2f6e'),ACC=H('#ffc66b'),ACCS='#ffc66b';
const C={grass:H('#cde6b8'),sand:H('#f3e3c3'),road:H('#f4efe6'),court:H('#efe6d2'),pond:H('#a8d6e0'),earth:H('#e6d3ae'),rock:H('#c9b28e'),
  wall:[H('#f7efdf'),H('#ecddc2'),H('#ddd3eb'),H('#e9e1f2'),H('#f4e8e0'),H('#e4d8c6')],roof:[H('#c9bedb'),H('#d8c6ae'),H('#bfb6d3')],
  tree:[H('#a9d497'),H('#88bc85'),H('#cdebb8')],glass:H('#a8bed3'),glassN:H('#4a4f86')};
let DK=0;
const shd=()=>M(SHD_DAY,SHD_NIGHT,DK);
const col=a=>RGB(M(a,NIGHT,.34*DK));
// camera
let S=80,A=0,CX=540,CY=960,CA=1,SA=0;
const rot=(x,y)=>[x*CA-y*SA,x*SA+y*CA];
const proj=(x,y,z)=>{const r=rot(x,y);return[CX+(r[0]-r[1])*.866*S,CY+(r[0]+r[1])*.5*S-z*S]};
const cv=$('cv'),ctx=cv.getContext('2d');
const poly=(pts,fill,alpha=1,stroke)=>{ctx.globalAlpha=alpha;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke()}ctx.globalAlpha=1};
// a face from 3D points with outward normal n; returns false when facing away
function face(pts,n,base,al=1){
  const r=rot(n[0],n[1]);if(r[0]+r[1]+n[2]<=.01)return false;
  const L=Math.hypot(n[0],n[1],n[2])||1,u=clamp((r[0]-r[1])/L/1.2,-1,1);
  const c=u>0?M(base,shd(),.4*u):M(base,WHITE,.12*-u);
  poly(pts.map(p=>proj(p[0],p[1],p[2])),col(c),al);return true}
// oriented box; opts.win={rows,fh,progs,lit(t,x,y)} draws windows on visible side faces
function corners(cx,cy,hw,hd,ang){const c=Math.cos(ang),s=Math.sin(ang);return[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([a,b])=>[cx+a*c-b*s,cy+a*s+b*c])}
function box(cx,cy,hw,hd,ang,z0,z1,top,side,win,t,al=1){
  const P=corners(cx,cy,hw,hd,ang),ns=[[0,-1],[1,0],[0,1],[-1,0]],c=Math.cos(ang),s=Math.sin(ang);
  for(let i=0;i<4;i++){
    const j=(i+1)%4,nx=ns[i][0]*c-ns[i][1]*s,ny=ns[i][0]*s+ns[i][1]*c;
    const ok=face([[P[i][0],P[i][1],z0],[P[j][0],P[j][1],z0],[P[j][0],P[j][1],z1],[P[i][0],P[i][1],z1]],[nx,ny,0],side,al);
    if(ok&&win)windows(P[i],P[j],z0,win,t,al)}
  poly(P.map(p=>proj(p[0],p[1],z1)),col(M(top,WHITE,.3*(1-DK*.6))),al,'rgba(255,255,255,.28)')}
function windows(p,q,zb,w,t,al){
  const len=Math.hypot(q[0]-p[0],q[1]-p[1]),dx=(q[0]-p[0])/len,dy=(q[1]-p[1])/len,n=Math.max(1,Math.round(len/.42)),ww=.17;
  for(let r=0;r<w.rows;r++){
    if(w.progs[r]<.97)continue;
    const z0=zb+r*w.fh+w.fh*.32,z1=zb+r*w.fh+w.fh*.7;
    for(let k=0;k<n;k++){
      const pos=(k+.5)*len/n,a=pos-ww/2,b=pos+ww/2;
      const q4=(e,za,zb2)=>[[p[0]+dx*(a-e),p[1]+dy*(a-e),za],[p[0]+dx*(b+e),p[1]+dy*(b+e),za],[p[0]+dx*(b+e),p[1]+dy*(b+e),zb2],[p[0]+dx*(a-e),p[1]+dy*(a-e),zb2]].map(v=>proj(v[0],v[1],v[2]));
      const L=ease((t-w.litT)/.22)*clamp((DK-.45)*3);
      if(L>0)poly(q4(.05,z0-.05,z1+.05),RGB(ACC),.2*L*al);
      poly(q4(0,z0,z1),RGB(M(M(C.glass,C.glassN,DK),ACC,L)),al)}}}
function gable(cx,cy,hw,hd,ang,zb,h,base){
  const c=Math.cos(ang),s=Math.sin(ang),T=(a,b)=>[cx+a*c-b*s,cy+a*s+b*c];
  const P=[T(-hw,-hd),T(hw,-hd),T(hw,hd),T(-hw,hd)],r0=T(-hw,0),r1=T(hw,0),n=(a,b)=>[a*c-b*s,a*s+b*c];
  const v=(p,z=zb)=>[p[0],p[1],z],top=zb+h;
  let nn=n(0,-h);face([v(P[0]),v(P[1]),v(r1,top),v(r0,top)],[nn[0],nn[1],hd],base);
  nn=n(0,h);face([v(P[3]),v(P[2]),v(r1,top),v(r0,top)],[nn[0],nn[1],hd],base);
  nn=n(1,0);face([v(P[1]),v(P[2]),v(r1,top)],[nn[0],nn[1],0],base);
  nn=n(-1,0);face([v(P[0]),v(P[3]),v(r0,top)],[nn[0],nn[1],0],base)}
function pyramid(cx,cy,hw,zb,h,base){
  const P=corners(cx,cy,hw,hw,0),ns=[[0,-1],[1,0],[0,1],[-1,0]];
  for(let i=0;i<4;i++){const j=(i+1)%4;face([[P[i][0],P[i][1],zb],[P[j][0],P[j][1],zb],[cx,cy,zb+h]],[ns[i][0]*h,ns[i][1]*h,hw],base)}}
function ball(x,y,z,r,fill,al=1){const p=proj(x,y,z);ctx.globalAlpha=al;ctx.beginPath();ctx.arc(p[0],p[1],r,0,7);ctx.fillStyle=fill;ctx.fill();ctx.globalAlpha=1}
function dome(cx,cy,zb,r,base){
  const p=proj(cx,cy,zb),rx=1.2247*r*S,ry=.7071*r*S,g=ctx.createLinearGradient(p[0]-rx,0,p[0]+rx,0);
  g.addColorStop(0,col(M(base,WHITE,.18)));g.addColorStop(.5,col(base));g.addColorStop(1,col(M(base,shd(),.42)));
  ctx.beginPath();ctx.ellipse(p[0],p[1],rx,rx,0,Math.PI,2*Math.PI);ctx.ellipse(p[0],p[1],rx,ry,0,0,Math.PI);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(p[0],p[1],rx,rx,0,Math.PI*1.05,Math.PI*1.5);ctx.stroke();
  return[p[0],p[1]-rx]}
function hull(pts){pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
  for(const p of pts){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(const p of pts.slice().reverse()){while(up.length>1&&cr(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  return lo.slice(0,-1).concat(up.slice(0,-1))}
// shadow of a footprint with height h, thrown to the screen bottom right (light from the top left)
function shadow(cx,cy,hw,hd,ang,h,al=1){
  if(h<.02)return;const P=corners(cx,cy,hw,hd,ang),pts=[];
  P.forEach(p=>{const r=rot(p[0],p[1]);[0,1].forEach(k=>{const rx=r[0]+k*h*.7,ry=r[1];pts.push([CX+(rx-ry)*.866*S,CY+(rx+ry)*.5*S-GZ*S])})});
  poly(hull(pts),RGB(M(SHD_DAY,SHD_NIGHT,DK)),(.24+.08*DK)*al)}
// ---------- world ----------
const GZ=.3,NI=4,FH=.5;
const inIsle=(i,j)=>i*i+j*j<=21;
const cells=[],houses=[],trees=[];
for(let i=-NI;i<=NI;i++)for(let j=-NI;j<=NI;j++){
  if(!inIsle(i,j))continue;
  const edge=!inIsle(i+1,j)||!inIsle(i-1,j)||!inIsle(i,j+1)||!inIsle(i,j-1);
  const road=i===0||j===0,mosq=(i===-3||i===-2)&&(j===2||j===3),pond=i===3&&j===-2;
  const d=Math.hypot(i,j);
  cells.push({i,j,d,t0:.3+d*.28,top:road?C.road:pond?C.pond:mosq?C.court:edge?C.sand:C.grass,road,mosq,pond,edge})}
const free=cells.filter(c=>!c.road&&!c.mosq&&!c.pond&&!(c.i===-1&&c.j===2));
free.forEach(c=>{const q=R();if(q<.5)houses.push(c);else if(q<.88)trees.push(c)});
houses.sort((a,b)=>a.d-b.d);
const MX=-2.5,MY=2.5;
houses.forEach((c,k)=>{
  const f=R()<.22?3:R()<.55?2:1,t0=1.7+k*.2,gap=.8+R()*.5;
  c.h={x:c.i+(R()-.5)*.1,y:c.j+(R()-.5)*.1,hw:.31+R()*.06,body:C.wall[Math.floor(R()*6)],roofC:C.roof[Math.floor(R()*3)],floors:f,t0,gap,gab:R()<.7,ang:R()<.5?0:Math.PI/2,
    litT:7+Math.hypot(c.i-MX,c.j-MY)*.19+R()*.1}});
trees.forEach((c,k)=>{c.tr={x:c.i+(R()-.5)*.3,y:c.j+(R()-.5)*.3,s:.8+R()*.5,t0:2.4+R()*4,c:C.tree[Math.floor(R()*2)]}});
const glints=Array.from({length:46},()=>{const a=R()*6.283,r=5.2+R()*4.5;return{x:Math.cos(a)*r,y:Math.sin(a)*r*.9,ph:R()*6.283,sp:.9+R()*1.4}});
const MFL=[1.5,1.9],MIN=[2.0,2.7,3.4,4.1];
function grow(starts,fh,t){const progs=starts.map(s=>t<s?0:back((t-s)/.32,1.9));let h=0;progs.forEach(p=>h+=p*fh);return{h,progs}}
// ---------- frame ----------
window.frame=function(t){
  DK=inout((t-5.6)/1.8);
  const g=inout(t/9.6);
  S=98-30*g;A=(-14+24*inout(t/10))*Math.PI/180;CX=540;CY=985-30*g;CA=Math.cos(A);SA=Math.sin(A);
  // sea
  const sg=ctx.createLinearGradient(0,0,0,1920);
  sg.addColorStop(0,RGB(M(H('#d2eee9'),H('#505a96'),DK)));sg.addColorStop(.5,RGB(M(H('#bfe3e0'),H('#968cc4'),DK)));sg.addColorStop(1,RGB(M(H('#acd6d6'),H('#f4b6a0'),DK)));
  ctx.fillStyle=sg;ctx.fillRect(0,0,1080,1920);
  // sea glints
  glints.forEach(q=>{const p=proj(q.x,q.y,0),a=Math.pow(Math.max(0,Math.sin(t*q.sp+q.ph)),3);if(a<.05)return;
    ctx.strokeStyle=DK>.3?`rgba(255,226,170,${a*.6})`:`rgba(255,255,255,${a*.7})`;ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(p[0]+16,p[1]);ctx.stroke()});
  // ripples
  const ra=clamp((t-1.2)/1);
  for(let k=0;k<3;k++){const ph=((t*.3+k/3)%1);ctx.strokeStyle=`rgba(255,255,255,${.3*(1-ph)*ra})`;ctx.lineWidth=3;ctx.beginPath();
    for(let n=0;n<=48;n++){const a=n/48*6.283,r=4.9+ph*1.5,p=proj(Math.cos(a)*r,Math.sin(a)*r,0);n?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])}ctx.stroke()}
  const dep=(x,y)=>{const r=rot(x,y);return r[0]+r[1]};
  // tiles, centre first
  cells.slice().sort((a,b)=>dep(a.i,a.j)-dep(b.i,b.j)).forEach(c=>{
    const p=(t-c.t0)/.42;if(p<=0)return;const b=back(p,1.3),dz=(1-b)*1.4,al=clamp(p*3);
    box(c.i,c.j,.5,.5,0,-.45+dz,-.12+dz,C.rock,C.rock,null,t,al);
    box(c.i,c.j,.5,.5,0,-.12+dz,GZ+dz,c.top,C.earth,null,t,al)});
  // shadows
  const objs=[];
  houses.forEach(c=>{const h=c.h;if(t<h.t0)return;const st=[0,1,2].slice(0,h.floors).map(f=>Math.min(h.t0+f*h.gap,6.6-(h.floors-1-f)*.3));const gr=grow(st,FH,t);
    shadow(h.x,h.y,h.hw,h.hw,h.ang,gr.h+(h.gab?.2:.07),clamp((t-c.t0)/.6));
    objs.push({d:dep(h.x,h.y),draw:()=>{
      box(h.x,h.y,h.hw,h.hw,h.ang,GZ,GZ+gr.h,h.body,h.body,{rows:h.floors,fh:FH,progs:gr.progs,litT:h.litT},t);
      const rp=back((t-h.t0-.15)/.35,1.9);
      if(rp>.02){if(h.gab)gable(h.x,h.y,h.hw+.05,h.hw+.05,h.ang,GZ+gr.h,.3*rp,h.roofC);else box(h.x,h.y,h.hw+.05,h.hw+.05,0,GZ+gr.h,GZ+gr.h+.07*rp,h.roofC,h.roofC,null,t)}}})});
  // masjid base, dome, minaret
  const mb=grow(MFL,.45,t);
  if(t>MFL[0]){shadow(MX,MY,.8,.8,0,mb.h+.9,1);
    objs.push({d:dep(MX,MY),draw:()=>{
      box(MX,MY,.8,.8,0,GZ,GZ+mb.h,H('#fbf5e8'),H('#f7efdf'),{rows:2,fh:.45,progs:mb.progs,litT:7.0},t);
      const dp=back((t-2.9)/.4,1.9);
      if(dp>.02){const dz=GZ+mb.h;box(MX,MY,.46,.46,0,dz,dz+.22*dp,H('#f7efdf'),H('#ecddc2'),null,t);const top=dome(MX,MY,dz+.22*dp,.62*dp,H('#f9f2e2'));
        ctx.fillStyle=RGB(M(H('#d9ccb0'),ACC,clamp((DK-.4)*2)));ctx.fillRect(top[0]-2,top[1]-.28*S*dp,4,.28*S*dp);
        ctx.beginPath();ctx.arc(top[0],top[1]-.3*S*dp,7*dp,0,7);ctx.fillStyle=ACCS;ctx.fill()}}})}
  const MNX=-1.25,MNY=2.0;
  if(t>MIN[0]){const mh=grow(MIN,.7,t),H0=mh.h;shadow(MNX,MNY,.2,.2,0,H0+.5,1);
    objs.push({d:dep(MNX,MNY)+.05,draw:()=>{
      box(MNX,MNY,.2,.2,0,GZ,GZ+H0,H('#f7efdf'),H('#f1e6d0'),{rows:4,fh:.7,progs:mh.progs,litT:7.05},t);
      const bp=back((t-3.9)/.35,1.9);if(bp>.02)box(MNX,MNY,.3,.3,0,GZ+H0-.02,GZ+H0+.07*bp,H('#e4d8c6'),H('#e4d8c6'),null,t);
      const cp=back((t-4.6)/.4,1.9);
      if(cp>.02){pyramid(MNX,MNY,.24,GZ+H0+.07,.6*cp,H('#c9bedb'));ball(MNX,MNY,GZ+H0+.07+.66*cp,6*cp+1,ACCS)}}})}
  // trees
  trees.forEach(c=>{const q=c.tr;if(t<q.t0)return;const p=back((t-q.t0)/.4,2.2),sq=1+.08*Math.sin(clamp((t-q.t0)/.5)*12)*(1-clamp((t-q.t0)/.5));
    objs.push({d:dep(q.x,q.y),draw:()=>{const r=.32*q.s*p,b=proj(q.x,q.y,GZ),f=proj(q.x,q.y,GZ+.3+.12*q.s*p),rr=1.2247*r*S;if(p<.02)return;
      ctx.fillStyle=col(H('#b99a72'));ctx.fillRect(b[0]-4,f[1],8,b[1]-f[1]);
      ctx.beginPath();ctx.arc(f[0]+rr*.14,f[1]+rr*.1,rr*sq,0,7);ctx.fillStyle=col(C.tree[1]);ctx.fill();
      ctx.beginPath();ctx.arc(f[0],f[1],rr*sq,0,7);ctx.fillStyle=col(q.c);ctx.fill();
      ctx.beginPath();ctx.arc(f[0]-rr*.28,f[1]-rr*.32,rr*.5,0,7);ctx.fillStyle=col(C.tree[2]);ctx.fill()}})});
  // cars on the roads
  [[0,-.2,0,.0],[3,.2,0,2.4],[5,0,.2,1.1]].forEach(([k,a,b,off],n)=>{if(t<3.6)return;
    const pos=((t-3.6)*.9+off*1.7)%8-4,al=clamp(Math.min(pos+4,4-pos)/.6)*ease((t-3.6)/.4);
    const x=n===2?b:pos*(n===1?-1:1),y=n===2?pos:a,ang=n===2?Math.PI/2:0;
    objs.push({d:dep(x,y),draw:()=>{box(x,y,.15,.08,ang,GZ,GZ+.09,H('#f7efdf'),H('#ecddc2'),null,t,al);
      const hl=clamp((DK-.4)*2);if(hl>0){const fx=x+(n===2?0:(n===1?-1:1)*.17),fy=y+(n===2?.17:0);ball(fx,fy,GZ+.05,5,ACCS,hl*al)}}})});
  // boats on a slow orbit
  [0,3.1].forEach((p0,n)=>{const a=p0+t*(n?-.14:.17)+.6,r=5.25+n*.15,x=Math.cos(a)*r,y=Math.sin(a)*r,dir=n?-1:1,hx=-Math.sin(a)*dir,hy=Math.cos(a)*dir,ang=Math.atan2(hy,hx);
    objs.push({d:dep(x,y),draw:()=>{
      const w=ease((t-1.8)/.8);if(w<.02)return;ctx.globalAlpha=w;
      ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.lineCap='round';
      [-1,1].forEach(s=>{const a0=proj(x-hx*.35+(-hy)*.08*s,y-hy*.35+hx*.08*s,0),a1=proj(x-hx*1.5+(-hy)*.4*s,y-hy*1.5+hx*.4*s,0);ctx.beginPath();ctx.moveTo(a0[0],a0[1]);ctx.lineTo(a1[0],a1[1]);ctx.stroke()});
      box(x,y,.34,.12,ang,-.03,.1,H('#ddd3eb'),H('#c9bedb'),null,t,w);
      const m=[x-hx*.05,y-hy*.05],sl=[[m[0]-hx*.2,m[1]-hy*.2,.1],[m[0]+hx*.22,m[1]+hy*.22,.1],[m[0]-hx*.05,m[1]-hy*.05,.78]];
      const nx=-hy,ny=hx,ps=sl.map(v=>proj(v[0],v[1],v[2]));poly(ps,col(M(H('#faf4e8'),shd(),.1+.25*(((nx*CA-ny*SA)-(nx*SA+ny*CA)>0)?1:0))),w);ctx.globalAlpha=1}})});
  objs.sort((a,b)=>a.d-b.d).forEach(o=>o.draw());
  // text
  const pos=(id,cy,dy)=>{$(id).style.top=cy+'px';return`translate(-50%,calc(-50% + ${dy}px))`};
  const tr=(id,cy,a,b)=>{const p=ease((t-a)/.6),q=b?1-ease((t-b)/.4):1,o=Math.min(p,q);const e=$(id);e.style.opacity=o;e.style.transform=pos(id,cy,(1-p)*14)};
  tr('c1',390,.5,3.3);tr('c2',390,3.5,6.0);tr('ci',1330,4.0);tr('hd',1420,8.6);
