<html><head><meta charset="utf-8">
<style>

<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Linocut relief print: two-colour (red reduction + black key) pulled twice on rice paper. Pure function of t.
window.SIZE={W:1080,H:1920};window.DURATION=10;
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
const W=1080,H_=1920,TAU=Math.PI*2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d',{willReadFrequently:true});
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const E={inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,out:t=>1-Math.pow(1-t,3),back:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
const lseg=(t,a,b)=>clamp((t-a)/(b-a));
// ---- seeded randomness and noise (the reference H helpers)
function rng(seed){let a=(seed>>>0)||1;const r=function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};r.range=(lo,hi)=>lo+r()*(hi-lo);r.chance=p=>r()<p;return r}
function makeNoise(seed){const r=rng(seed),p=new Uint8Array(512),perm=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}for(let i=0;i<512;i++)p[i]=perm[i&255];
 const fade=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+(b-a)*t,g3=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:h===12||h===14?x:z;return((h&1)?-u:u)+((h&2)?-v:v)};
 function n3(x,y,z){const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);const u=fade(x),v=fade(y),w=fade(z);const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
 return lp(lp(lp(g3(p[AA],x,y,z),g3(p[BA],x-1,y,z),u),lp(g3(p[AB],x,y-1,z),g3(p[BB],x-1,y-1,z),u),v),lp(lp(g3(p[AA+1],x,y,z-1),g3(p[BA+1],x-1,y,z-1),u),lp(g3(p[AB+1],x,y-1,z-1),g3(p[BB+1],x-1,y-1,z-1),u),v),w)}

const layer=(w=W,h=H_)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const PAPER=[240,232,212],RED=[196,58,38],INKK=[26,23,22];
const KX0=70,KY0=200,KX1=1010,KY1=1430;
const HEAD='"Arial Black",Impact,sans-serif',SERIF='Baskerville,"Baskerville Old Face",Georgia,serif',HAND='"Bradley Hand","Noteworthy","Marker Felt",cursive';
const AR1='أَحَبَّ الأَعْمَالِ أَدْوَمُهَا',AR2='إِلَى اللَّهِ، وَإِنْ قَلَّ';
const HAR=/[ً-ْٰ]/g;
// ---- sound (soft reel: paper, wood nicks, a pen, one bell)
add(0.05,'kit:foley-paper-touch',.6);add(.25,'kit:whoosh-medium-soft',.5);
add(.9,'tap',.14);add(1.9,'tap',.14);
for(let i=0;i<8;i++)add(1.3+i*.34+.04,'wood',.16);
add(3.6,'kit:foley-paper-touch',.6);add(3.65,'kit:whoosh-medium-soft',.5);
add(4.3,'kit:writing-pen-write',.5);
add(5.75,'tap',.16);add(6.85,'tap',.16);add(7.85,'tap',.16);
add(8.25,'kit:writing-pen-write',.45);add(8.9,'bell',.22);add(9.5,'bell2',.2);

// ---------- tapered strokes: the gouge
const tapered=(x,P,w,prof,N=14)=>{const L=[],R=[];for(let i=0;i<=N;i++){const s=i/N,a=P(Math.max(0,s-.01)),b=P(Math.min(1,s+.01)),p=P(s);let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;const ww=(w*prof(s))/2;L.push([p[0]-dy*ww,p[1]+dx*ww]);R.push([p[0]+dy*ww,p[1]-dx*ww])}
 x.beginPath();x.moveTo(L[0][0],L[0][1]);for(let i=1;i<L.length;i++)x.lineTo(L[i][0],L[i][1]);for(let i=R.length-1;i>=0;i--)x.lineTo(R[i][0],R[i][1]);x.closePath();x.fill()};
const lens=s=>Math.pow(Math.sin(Math.PI*s),.6),tail=s=>Math.min(1,s*7)*Math.pow(1-s,.9);
const quad=(x0,y0,cx,cy,x1,y1)=>s=>[(1-s)*(1-s)*x0+2*(1-s)*s*cx+s*s*x1,(1-s)*(1-s)*y0+2*(1-s)*s*cy+s*s*y1];
const line=(x0,y0,x1,y1,bend)=>{const nx=-(y1-y0),ny=x1-x0;return quad(x0,y0,(x0+x1)/2+nx*bend,(y0+y1)/2+ny*bend,x1,y1)};
const leaf=(x,x0,y0,x1,y1,bend)=>{const mx=(x0+x1)/2,my=(y0+y1)/2,nx=-(y1-y0),ny=x1-x0;x.beginPath();x.moveTo(x0,y0);x.quadraticCurveTo(mx+nx*bend,my+ny*bend,x1,y1);x.quadraticCurveTo(mx-nx*bend*.45,my-ny*bend*.45,x0,y0);x.closePath()};
const nick=(k,x,y,a,l,w,r)=>tapered(k,line(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l,r.range(-.06,.06)),w,lens,6);
const raysAround=(k,cx,cy,r0,r1,n,seed,w=16)=>{const r=rng(seed);k.save();k.beginPath();k.rect(KX0+19,KY0+19,KX1-KX0-38,KY1-KY0-38);k.clip();
 for(let i=0;i<n;i++){const a=(i/n)*TAU+r.range(-.03,.03),long=i%2===0,e=long?r1:r0+(r1-r0)*r.range(.25,.45);
  tapered(k,line(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0,cx+Math.cos(a)*e,cy+Math.sin(a)*e,r.range(-.02,.02)),long?w:w*.55,long?(s=>Math.pow(Math.sin(Math.PI*Math.min(1,s*1.12)),.5)*(1-s*.3)):lens,18)}k.restore()};
const chips=(k,n,seed,avoid)=>{const r=rng(seed);for(let i=0;i<n;i++){const x0=r.range(KX0+24,KX1-24),y0=r.range(KY0+24,KY1-24);if(avoid&&avoid(x0,y0))continue;const a=r.range(-.5,.5)+(r.chance(.5)?0:Math.PI/2),l=r.range(6,14);tapered(k,line(x0,y0,x0+Math.cos(a)*l,y0+Math.sin(a)*l,.15),r.range(2.5,5),lens,4)}};
const chatterRing=(k,cx,cy,r0,r1,n,seed,avoid)=>{const r=rng(seed);for(let i=0;i<n;i++){const a=r()*TAU,rr=r0+r()*r()*(r1-r0),x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr,l=r.range(12,30)*(1-(rr-r0)/(r1-r0)*.5);
 const ex=x+Math.cos(a)*l,ey=y+Math.sin(a)*l;if(Math.min(x,ex)<KX0+28||Math.max(x,ex)>KX1-28||Math.min(y,ey)<KY0+28||Math.max(y,ey)>KY1-28)continue;
 if(avoid&&(avoid(x,y)||avoid(ex,ey)))continue;nick(k,x,y,a+r.range(-.08,.08),l,r.range(3,6),r);
 if(r.chance(.45))nick(k,x+Math.cos(a+1.57)*9,y+Math.sin(a+1.57)*9,a+r.range(-.1,.1),l*r.range(.5,.85),r.range(2.5,4.5),r)}};
const chatterEdge=(k,n,seed,avoid)=>{const r=rng(seed),x0=KX0+20,y0=KY0+20,x1=KX1-20,y1=KY1-20;for(let i=0;i<n;i++){const side=Math.floor(r()*4),u=r();
 const[x,y,a]=side===0?[lerp(x0,x1,u),y0,Math.PI/2]:side===1?[lerp(x0,x1,u),y1,-Math.PI/2]:side===2?[x0,lerp(y0,y1,u),0]:[x1,lerp(y0,y1,u),Math.PI];
 const l=r.range(10,26),aa=a+r.range(-.35,.35);if(avoid&&(avoid(x,y)||avoid(x+Math.cos(aa)*l,y+Math.sin(aa)*l)))continue;nick(k,x,y,aa,l,r.range(3,5.5),r)}};
// carved lettering (each letter nudged and tilted a hair); shrinks to fit maxW
const carveText=(k,s,px,x,y,ls,seed,maxW)=>{const r=rng(seed);let size=px;k.font=`400 ${size}px ${HEAD}`;k.letterSpacing=ls+'px';let tw=k.measureText(s).width;if(maxW&&tw>maxW){size=Math.floor(size*maxW/tw);k.font=`400 ${size}px ${HEAD}`;k.letterSpacing=ls+'px';tw=k.measureText(s).width}
 k.textBaseline='middle';k.textAlign='left';let cx=x-tw/2;for(const ch of s){const cw=k.measureText(ch).width;k.save();k.translate(cx,y+r.range(-1.5,1.5));k.rotate(r.range(-.03,.03));k.fillText(ch,0,0);k.restore();cx+=cw}k.letterSpacing='0px'};
// a leaf: black body, a carved midrib and side veins
const leafBlack=(k,bx,by,tx,ty,bend,g)=>{if(g<=0)return;const x1=lerp(bx,tx,g),y1=lerp(by,ty,g);
 k.globalCompositeOperation='source-over';k.fillStyle='#000';leaf(k,bx,by,x1,y1,bend);k.fill();
 k.globalCompositeOperation='destination-out';
 const L=Math.hypot(x1-bx,y1-by),dx=(x1-bx)/L,dy=(y1-by)/L,nx=-dy,ny=dx;
 tapered(k,line(bx,by,bx+dx*L*.86,by+dy*L*.86,bend*.5),Math.max(2.4,L*.026),tail,10);
 if(L>130)for(let j=1;j<=4;j++){const u=.2+j*.15,px=bx+dx*L*u+nx*bend*L*.13*Math.sin(Math.PI*u),py=by+dy*L*u+ny*bend*L*.13*Math.sin(Math.PI*u);
  tapered(k,line(px,py,px+(dx*.5+nx*.85)*L*.14,py+(dy*.5+ny*.85)*L*.14,.05),Math.max(2.2,L*.016),tail,6)}

// a sprout: curved stem and two leaves (black key; the same leaves go into the red block, misregistered)
const sprout=(k,rd,cx,by,sc,g,red)=>{
 const sg=Math.min(1,g*1.4),lg=clamp((g-.25)/.75);
 if(red&&lg>0){rd.fillStyle='#000';leaf(rd,cx+.04*sc+8,by-.5*sc-3,lerp(cx+.04*sc,cx-.5*sc,lg)+8,lerp(by-.5*sc,by-.95*sc,lg)-3,-.5);rd.fill();leaf(rd,cx+.04*sc+8,by-.55*sc-3,lerp(cx+.04*sc,cx+.55*sc,lg)+8,lerp(by-.55*sc,by-1.05*sc,lg)-3,.5);rd.fill()}
 k.globalCompositeOperation='source-over';k.fillStyle='#000';
 tapered(k,line(cx,by,cx+.04*sc,by-.55*sg*sc,.03),Math.max(5,.045*sc),s=>1-s*.35,8);
 leafBlack(k,cx+.04*sc,by-.5*sc,cx-.5*sc,by-.95*sc,-.5,lg);
 leafBlack(k,cx+.04*sc,by-.55*sc,cx+.55*sc,by-1.05*sc,.5,lg)};
// ---------- the static print surface (paper fibre, grain fields), built once
let LX=null;
const lhash=(x,y,s)=>{let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296};
const lowField=(seed,gw,gh,f)=>{const nz=makeNoise(seed),s=layer(gw,gh),sx=s.getContext('2d'),im=sx.createImageData(gw,gh);
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){const i=(y*gw+x)*4;im.data[i]=128+127*clamp(nz.fbm2(x*f,y*f,3)*1.7,-1,1);im.data[i+1]=128+127*clamp(nz.fbm2(x*f*2.3+17,y*f*.6,2)*1.7,-1,1);im.data[i+2]=128+127*clamp(nz.n2(x*f*3+5,y*f*3+9)*1.4,-1,1);im.data[i+3]=255}
 sx.putImageData(im,0,0);const b=layer(),bx=b.getContext('2d');bx.imageSmoothingQuality='high';bx.drawImage(s,0,0,W,H_);return bx.getImageData(0,0,W,H_).data};
const KC=layer(),KK=KC.getContext('2d',{willReadFrequently:true}),RC=layer(),RR=RC.getContext('2d',{willReadFrequently:true}),BC=layer(),BB=BC.getContext('2d',{willReadFrequently:true}),PC=layer(),PP=PC.getContext('2d',{willReadFrequently:true});
const OUT=ctx.createImageData(W,H_);
function init(){
 if(LX)return;
 const paper=layer(),px=paper.getContext('2d'),r=rng(12);px.fillStyle=`rgb(${PAPER})`;px.fillRect(0,0,W,H_);px.lineCap='round';
 for(let i=0;i<900;i++){const x0=r.range(-40,W+40),y0=r.range(-40,H_+40),a=r.range(0,TAU),l=r.range(30,170);px.strokeStyle=r.chance(.65)?`rgba(255,252,240,${r.range(.25,.6)})`:`rgba(150,128,90,${r.range(.08,.2)})`;px.lineWidth=r.range(.5,1.6);
  px.beginPath();px.moveTo(x0,y0);px.bezierCurveTo(x0+Math.cos(a)*l*.3+r.range(-15,15),y0+Math.sin(a)*l*.3+r.range(-15,15),x0+Math.cos(a)*l*.7+r.range(-15,15),y0+Math.sin(a)*l*.7+r.range(-15,15),x0+Math.cos(a)*l,y0+Math.sin(a)*l);px.stroke()}
 const pd=px.getImageData(0,0,W,H_).data,f1=lowField(31,135,240,.09),f2=lowField(57,360,640,.35);
 const N=W*H_;LX={PB:new Uint8ClampedArray(N*3),TO:new Int8Array(N),BR:new Int8Array(N),ST:new Int8Array(N),FI:new Int8Array(N),HH:new Uint8Array(N),H3:new Uint8Array(N),H5:new Uint8Array(N)};
 for(let y=0;y<H_;y++)for(let x=0;x<W;x++){const p=y*W+x,i=p*4,tooth=(f2[i]-128)/128,broad=(f1[i]-128)/128,streak=(f1[i+1]-128)/128,fine=(f2[i+2]-128)/128,hh=lhash(x,y,1);
  const pg=1+(hh-.5)*.05+tooth*.015+streak*.018+broad*.012;LX.PB[p*3]=pd[i]*pg;LX.PB[p*3+1]=pd[i+1]*pg;LX.PB[p*3+2]=pd[i+2]*pg;
  LX.TO[p]=tooth*127;LX.BR[p]=broad*127;LX.ST[p]=streak*127;LX.FI[p]=fine*127;LX.HH[p]=hh*255;LX.H3[p]=lhash(x>>1,y>>1,3)*255;LX.H5[p]=lhash(x>>1,y,5)*255}
}
// ---------- write-on helpers
const reveal=(c,x0,y0,w,h,u,fn)=>{if(u<=0)return;c.save();c.beginPath();c.rect(x0-6,y0,(w+12)*u,h);c.clip();fn();c.restore()};
// stripped (no vowel marks) words, each centred where the same word sits in the full text, so the body and the full line overlap exactly
function bodyWords(c,str,cx,y){const words=str.split(' '),w=c.measureText(str).width,R0=cx+w/2;c.save();c.textAlign='center';
 for(let i=0;i<words.length;i++){const wi=c.measureText(words.slice(0,i+1).join(' ')).width,ww=c.measureText(words[i]).width;c.fillText(words[i].replace(HAR,''),R0-wi+ww/2,y)}c.restore()}
// Arabic written with the pen: body (no vowel marks) swept right to left, then the full text fades in over it
function arabicPen(c,str,cx,y,size,u,marks){
 if(u<=0)return;c.save();c.direction='rtl';c.textAlign='center';c.textBaseline='alphabetic';c.font=size+'px ScheherazadeG';c.fillStyle='#000';

 if(marks>0){c.globalAlpha=marks;c.fillText(str,cx,y)}c.restore()}

// ---------- the two blocks (black key into k, red reduction into rd)
const PULL=[0,3.6],PEEL=.7;
let HILITE=null;
function scene(si,k,rd,t){

 k.fillStyle='#000';rd.fillStyle='#000';k.strokeStyle='#000';

 k.globalCompositeOperation='destination-out';k.lineWidth=4;k.strokeRect(KX0+14,KY0+14,KX1-KX0-28,KY1-KY0-28);k.globalCompositeOperation='source-over';

 const band=(y0,y1)=>{k.fillRect(KX0+18,y0,KX1-KX0-36,y1-y0);out();k.fillRect(KX0+24,y0+6,KX1-KX0-48,y1-y0-12);inn();rd.fillRect(KX0+24,y0+6,KX1-KX0-48,y1-y0-12)};
 // letters cut out of the red block: paper-coloured type on vermilion; u writes them on left to right
 const redText=(str,px,x,y,ls,seed,u=1,maxW=840)=>{if(u<=0)return;rd.save();rd.beginPath();rd.rect(KX0,y-90,(KX1-KX0)*u,180);rd.clip();rd.globalCompositeOperation='destination-out';carveText(rd,str,px,x,y,ls,seed,maxW);rd.restore();rd.globalCompositeOperation='source-over';rd.fillStyle='#000'};
 if(si===0){
  const CX=540,CY=600;
  rd.beginPath();rd.arc(CX+3,CY-2,226,0,TAU);rd.fill();
  out();raysAround(k,CX,CY,262,1000,44,3,19);chips(k,150,5,(x,y)=>Math.hypot(x-CX,y-CY)<290||(y>940&&y<1120)||y>1150);
  k.beginPath();k.arc(CX,CY,232,0,TAU);k.fill();inn();
  // ring of short gouge dashes hugging the disc
  out();for(let i=0;i<64;i++){const a=(i/64)*TAU,r0=246+(i%2)*8;tapered(k,line(CX+Math.cos(a)*r0,CY+Math.sin(a)*r0,CX+Math.cos(a+.05)*(r0+16),CY+Math.sin(a+.05)*(r0+16),.1),6,lens,6)}inn();

  if(g>0){rd.fillStyle='#000';sprout(k,rd,CX,826,330,g,false)}

  out();k.fillRect(110,950,860,160);inn();
  k.lineWidth=5;k.strokeRect(120,960,840,140);
  for(let i=0;i<8;i++){const t0=1.3+i*.34;if(st<t0-1e-6)continue;const cx=120+84*.5+i*105,u=E.back(lseg(st,t0,t0+.25))
   sprout(k,rd,cx,1090,82,Math.min(1,u),true);
   // a small chop nick at the foot of each print
   if(st<t0+.3){k.globalCompositeOperation='destination-out';tapered(k,line(cx-26,1098,cx+26,1098,.02),4,lens,6);k.globalCompositeOperation='source-over'}}
  chatterRing(k,CX,CY,262,420,90,61,(x,y)=>y>930||Math.hypot(x-CX,y-CY)<258);chatterEdge(k,40,62,(x,y)=>y>930&&y<1130);
  band(1160,1410);
  const l1=lseg(t,.8,1.5),l2=lseg(t,1.8,2.5);
  redText('ONE SMALL LEAF,',76,540,1244,4,11,l1);redText('AGAIN AND AGAIN.',76,540,1340,4,12,l2);
 }
 if(si===1){
  const CX=540,CY=760;
  out();raysAround(k,CX,CY,300,1100,52,41,19);chips(k,150,6,(x,y)=>(x>120&&x<960&&y>290&&y<1150)||y>1170);
  k.fillRect(130,300,820,850);inn();
  k.lineWidth=5;k.strokeRect(146,316,788,818);
  out();for(let i=0;i<30;i++){const x=170+i*25.5;tapered(k,line(x,1112,x+9,1122,.1),4,lens,5);tapered(k,line(x+13,1112,x+4,1124,.1),3,lens,5)}inn();
  chatterRing(k,CX,CY,420,560,60,71,(x,y)=>(x>120&&x<960&&y>290&&y<1160)||y>1170);chatterEdge(k,38,72,(x,y)=>y>1170);
  // Arabic, written with the pen
  const u1=lseg(t,4.3,5.0),u2=lseg(t,5.0,5.7),mk=lseg(t,5.7,6.0);
  arabicPen(k,AR1,540,590,94,u1,mk);arabicPen(k,AR2,540,720,94,u2,mk);
  // English, cut in line by line
