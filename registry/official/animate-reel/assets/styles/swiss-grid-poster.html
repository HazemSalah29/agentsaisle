<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Scheherazade;src:url(../ScheherazadeNew-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#efece3}
svg{position:absolute;inset:0}
.t{position:absolute;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#111;white-space:nowrap}
#hard,#ease{font-weight:700;font-size:210px;letter-spacing:-8px;line-height:1;left:84px}
#ease{color:#e03a2b}
#ar{position:absolute;right:90px;top:600px;font-family:Scheherazade,serif;font-size:132px;line-height:1.9;color:#111;direction:rtl;white-space:nowrap}
#en{left:90px;top:900px;width:820px;font-weight:700;font-size:76px;line-height:1.08;letter-spacing:-2px;white-space:normal}
#cite{left:90px;top:1236px;font-size:26px;letter-spacing:9px;font-weight:500}
#hdr{left:90px;top:262px;font-size:24px;letter-spacing:7px;font-weight:500}
#lab1,#lab2{font-size:24px;letter-spacing:7px;font-weight:500}
#handle{left:90px;top:1416px;font-size:24px;letter-spacing:9px;font-weight:700;color:#1f4aa8}
</style></head>
<body>
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div class="t" id="hdr">NO. 94 / 5</div>
<div class="t" id="hard">Hard.</div>
<div class="t" id="ease">Ease.</div>
<div id="ar">فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا</div>
<div class="t" id="en">For indeed, with hardship [will be] ease.</div>
<div class="t" id="cite">QURAN 94:5</div>
<div class="t" id="handle">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
// slide that overshoots a hair then locks to the grid
const lock=x=>{x=clamp(x);const c1=1.1,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
add(.8,'slide',.3);add(1.6,'thud',.35);add(3.0,'slide',.3);add(3.8,'thud',.3);add(3.9,'plink',.3);
add(5.6,'slide',.25);add(6.3,'tap',.25);add(7.4,'rise',.3);add(7.4,'boom',.4);add(8.3,'tap',.22);
const RED='#e03a2b',YEL='#f2c230',BLU='#1f4aa8',INK='#111';
const GX=90,GY=270,U=150; // 6 columns x 8 rows of 150
function grid(t){
  const p=ease(t/.9);let s='';
  for(let i=0;i<=6;i++){const x=GX+i*U;s+=`<line x1="${x}" y1="${GY}" x2="${x}" y2="${GY+p*8*U}" stroke="${INK}" stroke-opacity=".13" stroke-width="2"/>`}
  for(let j=0;j<=8;j++){const y=GY+j*U;s+=`<line x1="${GX}" y1="${y}" x2="${GX+p*6*U}" y2="${y}" stroke="${INK}" stroke-opacity=".13" stroke-width="2"/>`}
  return s;
}
function up(el,t,t0,d=.6){const p=ease((t-t0)/d);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*30}px)`}
// wipe in from the left edge of the text box, wipe out to the left
function wipe(el,tin,tout){const a=ease((tin)/.55),b=tout==null?0:inout(tout/.5);
  el.style.clipPath=`inset(0 ${(1-a)*100}% 0 ${b*100}%)`;el.style.transform=`translateX(${(1-a)*-60 - b*0}px)`}
window.frame=function(t){
  // group (square + circle) travels from poster centre to the top-left mark
  const g=inout((t-5.6)/.8);
  const sc=1-.75*g, ox=GX, oy=420+(290-420)*g;
  let s=grid(t);
  // square slides in from the left, locks at col 0, row 1
  const sq=lock((t-.8)/.8), sqx=-700+(0+700)*sq;
  const ci=lock((t-3.0)/.8), cix=1300+(600-1300+0)*ci;
  let G='';
  if(t>=.8)G+=`<rect x="${sqx}" y="0" width="600" height="600" fill="${INK}"/>`;
  if(t>=3.0)G+=`<circle cx="${cix}" cy="300" r="150" fill="${YEL}"/>`;
  // a thin red bar locks under the pair when the circle lands
  if(t>=3.8){const b=ease((t-3.8)/.4);G+=`<rect x="0" y="${600+12}" width="${600*b}" height="12" fill="${RED}"/>`}
  s+=`<g transform="translate(${ox} ${oy}) scale(${sc})">${G}</g>`;
  $('s').innerHTML=s;
  up($('hdr'),t,.2,.6);
  // big words sit under the shapes; they wipe off to the left before the verse
  const out=t>5.5?(t-5.5):null;
  $('hard').style.top='1030px';$('ease').style.top='1230px';
  $('hard').style.display=t>=1.7?'block':'none';$('ease').style.display=t>=3.9?'block':'none';
  wipe($('hard'),t-1.7,out);wipe($('ease'),t-3.9,out);
  // verse: Arabic written right to left, then English, then citation
  const ar=$('ar'),w=clamp((t-6.3)/1.1);
  ar.style.clipPath=`inset(-30px 0 -30px ${(1-inout(w))*100}%)`;ar.style.opacity=t>=6.3?1:0;
  up($('en'),t,7.6,.7);
  up($('cite'),t,8.3,.6);
  $('handle').style.opacity=ease((t-8.9)/.6)*.9;
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
