<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Scheherazade;src:url(../ScheherazadeNew-Regular.ttf)}
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0c0e}
canvas{position:absolute;inset:0}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const cv=document.getElementById('c'),g=cv.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=2.2;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
const INK='#ece6d8',DIM='#2a2a30',GOLD='#e0a93b',SERIF='Baskerville, Didot, Georgia, serif';
const COLS=30,N=365,P=28,GX=(1080-(COLS-1)*P)/2;
const BIG=5.0,SM0=5.5,SM1=8.7;
const cnt=t=>Math.floor(N*inout((t-SM0)/(SM1-SM0))+1e-6);
// sound
for(let r=0;r<13;r++)add(.9+r*.2,'tick',.18);
add(.3,'tap',.25);add(2.6,'tap',.25);
add(BIG,'plink',.35);
for(let k=1;k<=12;k++){let lo=SM0,hi=SM1;for(let i=0;i<30;i++){const m=(lo+hi)/2;if(cnt(m)>=k*30)hi=m;else lo=m;}add(hi,'tick',.2);}
add(SM1+.05,'thud',.4);add(8.95,'bell',.3);
// text helper
function txt(s,x,y,size,col,a,al='center',font=SERIF,ls=0){g.globalAlpha=a;g.fillStyle=col;g.font=size+'px '+font;g.textAlign=al;g.letterSpacing=ls+'px';g.fillText(s,x,y);g.letterSpacing='0px';g.globalAlpha=1}
function dot(i,gy,state,t0,t){ // state: 0 dim, 1 lit at t0
  const x=GX+(i%COLS)*P,y=gy+Math.floor(i/COLS)*P;
  if(state&&t>=t0){const k=clamp((t-t0)/.5);const s=1+.45*(1-ease(k*1.2));
    g.fillStyle=k<1?'#fff3cf':GOLD;g.globalAlpha=1;g.beginPath();g.arc(x,y,9*s*(k<1?1:1),0,7);g.fill();
    if(k<1){g.globalAlpha=.25*(1-k);g.fillStyle=GOLD;g.beginPath();g.arc(x,y,22*k+9,0,7);g.fill();g.globalAlpha=1}
  }else{g.fillStyle=DIM;g.beginPath();g.arc(x,y,6,0,7);g.fill()}
}
function lit(i){ // time dot i of small ledger lights
  let lo=SM0,hi=SM1;for(let k=0;k<24;k++){const m=(lo+hi)/2;if(cnt(m)>i)hi=m;else lo=m;}return hi;}
const LIT=[];for(let i=0;i<N;i++)LIT.push(lit(i));
window.frame=function(t){
  g.clearRect(0,0,1080,1920);g.fillStyle='#0c0c0e';g.fillRect(0,0,1080,1920);
  const a1=1-ease((t-4.2)/.4);
  // hook
  if(a1>0){
    const p1=ease((t-.3)/.6),p2=ease((t-2.6)/.6);
    txt('The Prophet ﷺ named the deed',540,600+(1-p1)*14,50,INK,p1*a1);
    txt('Allah loves most.',540,672+(1-p1)*14,50,INK,p1*a1);
    txt('It is not the biggest one.',540,860+(1-p2)*14,50,GOLD,p2*a1);
    // dim year grid rising row by row
    for(let i=0;i<N;i++){const r=Math.floor(i/COLS),k=ease((t-(.9+r*.2))/.4);
      if(k<=0)continue;const x=GX+(i%COLS)*P,y=1060+r*P;g.globalAlpha=k*a1;g.fillStyle=DIM;g.beginPath();g.arc(x,y,6,0,7);g.fill();}
    g.globalAlpha=1;
    txt('A YEAR, 365 DAYS',540,1010,20,'#8a8780',ease((t-1)/.6)*a1,'center','Menlo, monospace',5);
  }
  // ledgers
  const b=ease((t-4.4)/.6);
  if(b>0){
    const A=330,B=880;
    g.globalAlpha=b;
    // panel A: big deed once
    txt('DONE ONCE',GX-6,A,24,'#8a8780',b,'left','Menlo, monospace',5);
    const nA=t>=BIG?1:0;
    txt(nA+(nA===1?' day':' days'),1080-GX+6,A+4,60,nA?GOLD:'#555',b,'right');
    for(let i=0;i<N;i++)dot(i,A+50,i===0,BIG,t);
    // panel B: small deed every day
    txt('A SMALL DEED, EVERY DAY',GX-6,B,24,'#8a8780',b,'left','Menlo, monospace',5);
    const n=t<SM0?0:cnt(t);
    let sc=1;if(t>=SM1)sc=1+.18*Math.max(0,1-(t-SM1)/.5)*Math.sin(Math.min(1,(t-SM1)/.5)*Math.PI*1.0)+0;
    g.save();g.translate(1080-GX+6,B+4);g.scale(sc,sc);txt(n+(n===1?' day':' days'),0,0,60,n?GOLD:'#555',b,'right');g.restore();
    for(let i=0;i<N;i++)dot(i,B+50,true,LIT[i],t);
    g.globalAlpha=1;
    const c=ease((t-8.95)/.6);
    txt('Same days. One kept going.',540,1470+(1-c)*12,48,INK,c);
    txt('Sahih al-Bukhari 6464',540,1540,20,'#8a8780',c,'center','Menlo, monospace',4);
  }
  txt('@YOURPAGE',540,1700,20,'#6c6a64',.8,'center','Menlo, monospace',5);
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
