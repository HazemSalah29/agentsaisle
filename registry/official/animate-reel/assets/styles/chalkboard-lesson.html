<script>
// Chalkboard lesson: dusty chalk on green slate. Chalk is four parallel sub-strokes, then a grain pass so only the

const ctx=document.getElementById('c').getContext('2d');
const nz=makeNoise(31);
const W=1080,H=1920,TRAY=1650,F=36;

// ---------------------------------------------------------------- static board (baked once)
let SLATE=null,FRAME=null,TOOTH=null;
function slatePaper(c,w,h,base,seed,strength){c.fillStyle=base;c.fillRect(0,0,w,h);const n=makeNoise(seed),cell=4,br=parseInt(base.slice(1,3),16),bg=parseInt(base.slice(3,5),16),bb=parseInt(base.slice(5,7),16);

   [['2 + 2 = 4',620,1130],['p. 112',110,1390],['3/4 = 0.75',560,1480],['due Friday',90,1015],['x + 5 = 9',700,1560],['spell it',160,240]].forEach(([t,x,y])=>gc.fillText(t,x,y));

  const TS=256,tile=layer(TS,TS),tc=tile.getContext('2d'),img=tc.createImageData(TS,TS),d=img.data,r2=rng(21),coarse=new Float32Array(64*64);for(let i=0;i<coarse.length;i++)coarse[i]=r2()-.5;

    for(let i=0;i<70;i++){const o=r()*(horiz?h:w),dark=r.chance(.6);f.strokeStyle=dark?`rgba(60,34,14,${r.range(.1,.35)})`:`rgba(210,160,100,${r.range(.06,.18)})`;f.lineWidth=r.range(.6,2.2);f.beginPath();const len=horiz?w:h,fq=r.range(.004,.012),amp=r.range(.5,3),ph=r.range(0,6);

// ---------------------------------------------------------------- per-frame chalk
const CL=layer(W,H),cc=CL.getContext('2d');cc.lineCap='round';cc.lineJoin='round';
let TIP=null,TIPT=-1;
const win=(t,a,b)=>clamp((t-a)/(b-a));
function chalk(pts,col,w,seed,prog,pr=.85,t0=0){

      for(let j=i;j<=Math.min(P.length-1,i+6);j++){const x=P[j][0]+N[j][0]*off,y=P[j][1]+N[j][1]*off;j===i?cc.moveTo(x,y):cc.lineTo(x,y)}cc.stroke()}}}
const L=(pts,s,amp=1.4)=>wob(seg(pts),s,amp);
// handwriting, centred or left aligned, one jittered glyph at a time
function write(str,x,y,font,col,seed,t0,t1,t,align='c'){

// ---------------------------------------------------------------- story geometry
const BX=i=>290+i*105,RA=520,RB=670,BS=90;
