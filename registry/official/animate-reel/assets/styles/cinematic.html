<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05060d}
#stage{position:absolute;inset:0;transform-origin:50% 62%}
.sky{position:absolute;inset:0}
#sky1{background:linear-gradient(#070a1c 0%,#151335 38%,#3a2140 62%,#5a3134 74%,#1a1012 100%)}
#sky2{background:linear-gradient(#03040c 0%,#0a0d24 50%,#141226 74%,#0b0809 100%)}
svg,canvas{position:absolute;inset:0}
.txt{position:absolute;left:100px;right:100px;text-align:center;color:#f3efe6;font-family:Baskerville,"Libre Baskerville",serif;font-size:50px;line-height:1.3;text-wrap:balance;opacity:0;text-shadow:0 2px 20px rgba(0,0,0,.6)}
.gold{color:#e6c27a}
#hd{position:absolute;bottom:250px;left:0;right:0;text-align:center;font-family:Baskerville,serif;font-size:22px;letter-spacing:.2em;color:rgba(243,239,230,.62)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 760px 1150px at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
</style></head>
<body>
<div id="stage">
  <div class="sky" id="sky1"></div><div class="sky" id="sky2" style="opacity:0"></div>
  <canvas id="stars" width="1080" height="1920"></canvas>
  <svg viewBox="0 0 1080 1920" width="1080" height="1920">
    <defs>
      <radialGradient id="mg"><stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/><stop offset="1" stop-color="#fff6dc" stop-opacity="0"/></radialGradient>
      <radialGradient id="fg"><stop offset="0" stop-color="#fff3d2" stop-opacity=".8"/><stop offset="1" stop-color="#fff3d2" stop-opacity="0"/></radialGradient>
      <linearGradient id="shaft" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff3d2" stop-opacity="0"/><stop offset="1" stop-color="#fff3d2" stop-opacity=".35"/></linearGradient>
      <mask id="cres"><rect width="1080" height="1920" fill="#fff"/><circle cx="867" cy="207" r="42" fill="#000"/></mask>
    </defs>
    <circle cx="850" cy="215" r="150" fill="url(#mg)"/>
    <circle cx="850" cy="215" r="44" fill="#fff6dc" mask="url(#cres)"/>
    <g id="far" fill="#120d16"><path d="M0 1330 C 160 1270 300 1300 420 1260 C 560 1220 700 1290 820 1250 C 930 1215 1010 1240 1080 1225 L1080 1920 L0 1920 Z"/></g>
    <g id="near" fill="#08060a">
      <path d="M0 1420 L1080 1420 L1080 1920 L0 1920 Z"/>
      <rect x="120" y="1250" width="70" height="170"/><path d="M110 1250 h90 l-45 -60 z"/><rect x="150" y="1150" width="10" height="40"/>
      <path d="M250 1420 v-120 a90 90 0 0 1 180 0 v120 z"/><rect x="330" y="1180" width="20" height="30"/>
      <path d="M860 1420 v-60 l40 -40 l40 40 v60 z"/><path d="M960 1420 c0 -80 20 -160 30 -230 c10 70 30 150 30 230 z"/>
    </g>
    <g id="rises"></g>
    <rect id="beam" x="508" y="700" width="64" height="680" fill="url(#shaft)" opacity="0"/>
    <circle id="fglow" cx="540" cy="1380" r="140" fill="url(#fg)" opacity="0"/>
    <g id="fig" fill="#fdf7e8" opacity="0"><circle cx="540" cy="1318" r="16"/><path d="M516 1420 c-4 -40 4 -78 24 -82 c20 4 28 42 24 82 z"/></g>
  </svg>
</div>
<canvas id="grain" width="540" height="960" style="width:1080px;height:1920px;opacity:.09"></canvas>
<div id="vig"></div>
<div class="txt" id="a1" style="top:330px">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="txt gold" id="a2" style="top:520px;font-style:italic">It is not the biggest one.</div>
<div class="txt" id="b1" style="top:330px">One small prayer.</div>
<div class="txt gold" id="b2" style="top:410px;font-style:italic">Every night.</div>
<div id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
const rnd=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const R=rnd(11),STARS=[...Array(160)].map(()=>[R()*1080,R()*1150,R()*1.6+.4,R()*6]);
const N0=5.2,NS=.62; // one night every NS seconds; each night's prayer rises and becomes a star
const nights=[];for(let k=0;N0+k*NS<9.6;k++){nights.push({t:N0+k*NS,x:180+((k*367)%720),y:240+((k*211)%620)});add(N0+k*NS+.55,'plink',.2)}
add(.2,'bong',.4);add(.4,'drop',.2);add(2.5,'drop',.2);add(4.7,'bong',.35);add(4.9,'drop',.2);add(5.6,'drop',.18);
const g=$('grain').getContext('2d');
window.frame=function(t){
  $('stage').style.transform=`scale(${1+.06*t/10})`;
  $('sky2').style.opacity=inout((t-4.4)/1.2)*.85;
  const c=$('stars').getContext('2d');c.clearRect(0,0,1080,1920);
  for(const [x,y,r,p] of STARS){c.globalAlpha=.35+.35*Math.sin(t*1.7+p);c.fillStyle='#fff';c.beginPath();c.arc(x,y,r,0,7);c.fill()}
  c.globalAlpha=1;
  // the figure and its glow
  const fo=ease((t-.6)/1.2);$('fig').setAttribute('opacity',fo);$('fglow').setAttribute('opacity',fo*(.7+.15*Math.sin(t*2)));
  // after the hook: each night a small light rises from the figure and settles as a new star
  let r='';for(const n of nights){const p=(t-n.t)/1.1;if(p<0)continue;const q=inout(p);
    const x=540+(n.x-540)*q,y=1330+(n.y-1330)*q,s=p<1?7:3.2+.6*Math.sin(t*2+n.x);
    r+=`<circle cx="${x}" cy="${y}" r="${s*4}" fill="#ffe7a8" opacity="${p<1?.25:.18}"/><circle cx="${x}" cy="${y}" r="${s}" fill="#fff4cf"/>`}
  $('rises').innerHTML=r;$('beam').setAttribute('opacity',t>N0?.35+.2*Math.sin(t*3):0);
  // film grain from a seed that changes 12 times a second
  const G=rnd(1+Math.floor(t*12)),im=g.createImageData(540,960);for(let i=0;i<im.data.length;i+=4){const v=G()*255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);
  const up=(id,a,b)=>{const p=ease((t-a)/.8),o=b?1-ease((t-b)/.5):1;$(id).style.opacity=Math.min(p,o);$(id).style.transform=`translateY(${(1-p)*14}px)`};
  up('a1',.4,4.3);up('a2',2.5,4.3);up('b1',4.9);up('b2',5.6);
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
