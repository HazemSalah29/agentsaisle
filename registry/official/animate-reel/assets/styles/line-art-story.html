<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#100d0a}
svg{position:absolute;inset:0}
.cap{position:absolute;left:200px;width:780px;color:#e9e2d4;font-family:"Avenir Next",sans-serif;font-weight:500;font-size:40px;line-height:1.3;opacity:0}
.cap em{font-style:normal;color:#e58a3a}
#hd{position:absolute;bottom:260px;left:0;right:0;text-align:center;font-family:Menlo,monospace;font-size:20px;letter-spacing:.2em;color:rgba(233,226,212,.6)}
</style></head>
<body>
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920"></svg>
<div class="cap" id="c1" style="top:820px">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="cap" id="c2" style="top:925px">It is <em>not the biggest one.</em></div>
<div class="cap" id="c3" style="top:1320px">Same nights. <em>One kept going.</em></div>
<div id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ease=x=>1-Math.pow(1-clamp(x),3),inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
const INK='#e9e2d4',ACC='#e58a3a';
const L=(d,o=1,w=2.5,c=INK)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" opacity="${o}"/>`;
// poses, feet at (0,0)
const POSE={
  stand:o=>`<circle cx="0" cy="-150" r="15" fill="none" stroke="${INK}" stroke-width="2.5" opacity="${o}"/>`+L('M0 -135 V-62 M0 -62 L-12 0 M0 -62 L12 0 M0 -120 L-14 -96 L0 -92 M0 -120 L14 -96 L0 -92',o),
  bow:o=>`<circle cx="82" cy="-78" r="14" fill="none" stroke="${INK}" stroke-width="2.5" opacity="${o}"/>`+L('M0 0 V-70 H66 M48 -70 L50 -36',o),
  down:o=>`<circle cx="98" cy="-12" r="13" fill="none" stroke="${INK}" stroke-width="2.5" opacity="${o}"/>`+L('M0 0 H36 L36 -46 L84 -18 M74 -22 L96 0',o),
  sleep:o=>`<circle cx="-96" cy="-30" r="13" fill="none" stroke="${INK}" stroke-width="2.5" opacity="${o}"/>`+L('M-80 -26 H60',o),
};
function room(x,y,w,h,label,night,st){
  // st: {pose: name, o: opacity, lamp: 0..1}
  let s=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${INK}" stroke-opacity=".35" stroke-width="1.5"/>`;
  s+=`<text x="${x+w-14}" y="${y+28}" text-anchor="end" font-family="Menlo,monospace" font-size="17" letter-spacing="3" fill="${ACC}">${label}</text>`;
  if(night!=null)s+=`<text x="${x+16}" y="${y+28}" font-family="Menlo,monospace" font-size="17" letter-spacing="3" fill="${INK}" opacity=".7">NIGHT ${String(night).padStart(2,'0')}</text>`;
  const fy=y+h-40;s+=L(`M${x+20} ${fy} H${x+w-20}`,.6,2);
  // window with moon
  const wx=x+w-200,wy=y+50;s+=`<rect x="${wx}" y="${wy}" width="130" height="130" fill="#1a2140" stroke="${INK}" stroke-width="2.5"/>`+L(`M${wx+65} ${wy} V${wy+130} M${wx} ${wy+65} H${wx+130}`,.8,2)+`<circle cx="${wx+96}" cy="${wy+34}" r="10" fill="#f1e9d6"/>`;
  // bed
  s+=L(`M${x+w-330} ${fy} V${fy-40} H${x+w-60} V${fy} M${x+w-330} ${fy-40} V${fy-70} M${x+w-320} ${fy-52} q20 -14 50 0`,.9);
  // lamp + glow
  const lx=x+70;s+=`<circle cx="${lx}" cy="${fy-96}" r="90" fill="${ACC}" opacity="${.16*st.lamp}"/>`+L(`M${lx-30} ${fy} V${fy-60} H${lx+30} V${fy} M${lx} ${fy-60} V${fy-84} M${lx-18} ${fy-84} L${lx-12} ${fy-112} H${lx+12} L${lx+18} ${fy-84} Z`,.9,2)+`<path d="M${lx-18} ${fy-84} L${lx-12} ${fy-112} H${lx+12} L${lx+18} ${fy-84} Z" fill="${ACC}" opacity="${.7*st.lamp}"/>`;
  // person
  const px=st.pose==='sleep'?x+w-200:x+200,py=st.pose==='sleep'?fy-44:fy;
  s+=`<g transform="translate(${px} ${py})">${POSE[st.pose](st.o)}</g>`;
  return s;
}
function dial(cx,cy,a){return `<circle cx="${cx}" cy="${cy}" r="34" fill="none" stroke="${INK}" stroke-width="2" opacity=".8"/>`+L(`M${cx} ${cy} L${cx+Math.sin(a)*22} ${cy-Math.cos(a)*22} M${cx} ${cy} L${cx+Math.sin(a/12)*14} ${cy-Math.cos(a/12)*14}`,.9,2.5,ACC)}
const N0=5.0,NS=.8,ORDER=['stand','bow','down','stand'];
for(let k=0;N0+k*NS<10;k++){add(N0+k*NS,'tick',.25)}
add(.3,'tap',.25);add(2.6,'tap',.25);add(4.6,'slide',.3);add(5.1,'tap',.25);add(5.85,'thud',.3);
window.frame=function(t){
  let s='';
  if(t<4.6){ // hook: one quiet room at night, a lamp warming up
    const o=1-ease((t-4.1)/.5);
    s+=`<g opacity="${o}">`+room(90,300,900,460,'TONIGHT',null,{pose:t<2.6?'sleep':'stand',o:1,lamp:ease((t-2.6)/.6)})+dial(140,860,t*1.2)+`</g>`;
  }else{ // two rooms on one clock: the big deed stops after one night, the small one goes on
    const k=Math.floor((t-N0)/NS),night=Math.max(1,k+1),ph=((t-N0)/NS)%1,o=ease((t-4.6)/.5);
    const big=t<N0+.8?{pose:'stand',o:1,lamp:1}:{pose:'sleep',o:1,lamp:.15};
    const small={pose:t<N0?'stand':ORDER[Math.floor(ph*4)],o:1,lamp:1};
    s+=`<g opacity="${o}">`+room(90,300,900,440,'ONE BIG NIGHT',night,big)+room(90,780,900,440,'TWO RAKAT A NIGHT',night,small)+dial(140,1340,(t-4.6)*5)+`</g>`;
  }
  $('s').innerHTML=s;
  const up=(id,a,b)=>{const p=ease((t-a)/.6),q=b?1-ease((t-b)/.4):1;$(id).style.opacity=Math.min(p,q);$(id).style.transform=`translateY(${(1-p)*12}px)`};
  up('c1',.3,4.2);up('c2',2.6,4.2);up('c3',5.1);
  return {};
};
document.fonts.ready.then(()=>{frame(0);window.ready=true});
</script></body></html>
