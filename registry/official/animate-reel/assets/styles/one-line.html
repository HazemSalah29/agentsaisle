<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d121a}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 900px 1100px at 50% 46%,#1a2433 0%,#111823 55%,#0a0e15 100%)}
svg{position:absolute;inset:0}
#grain{position:absolute;inset:0;width:1080px;height:1920px;opacity:.07;mix-blend-mode:screen;image-rendering:auto}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 760px 1200px at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
.back{position:absolute;left:0;width:1080px;opacity:0;background:radial-gradient(ellipse 520px 50% at 50% 50%,rgba(9,12,18,.82) 0%,rgba(9,12,18,.55) 55%,rgba(9,12,18,0) 100%)}
.cap{position:absolute;left:90px;width:900px;text-align:center;color:#efe8d8;font-family:Baskerville,"Geeza Pro",Georgia,serif;font-weight:500;opacity:0;text-wrap:balance}
.cap em{font-style:normal;color:#f0b35a}
#c1{top:262px;font-size:66px;line-height:1.24}
#c2{top:300px;font-size:84px;line-height:1.2}
#c3a{top:1100px;font-size:84px;line-height:1.1}
#c3b{top:1196px;font-size:84px;line-height:1.1}
.lab{position:absolute;left:0;width:1080px;text-align:center;font-family:"Avenir Next",Helvetica,sans-serif;font-weight:600;font-size:40px;letter-spacing:.16em;opacity:0}
#cit{top:1312px;color:rgba(239,232,216,.82)}
#hd{top:1404px;color:#f0b35a;letter-spacing:.22em}
</style></head>
<body>
<div id="bg"></div>
<svg id="s" viewBox="0 0 1080 1920" width="1080" height="1920">
<defs>
<radialGradient id="gl"><stop offset="0" stop-color="#f0b35a" stop-opacity=".55"/><stop offset=".4" stop-color="#f0b35a" stop-opacity=".16"/><stop offset="1" stop-color="#f0b35a" stop-opacity="0"/></radialGradient>
<radialGradient id="gw"><stop offset="0" stop-color="#efe8d8" stop-opacity=".5"/><stop offset="1" stop-color="#efe8d8" stop-opacity="0"/></radialGradient>
</defs>
<g id="stars"></g>
<g id="world"></g>
</svg>
<canvas id="grain" width="540" height="960"></canvas>
<div id="vig"></div>
<div class="back" id="b1" style="top:200px;height:340px"></div>
<div class="back" id="b3" style="top:1040px;height:470px"></div>
<div class="cap" id="c1">The Prophet ﷺ named the deed Allah loves most.</div>
<div class="cap" id="c2">not the biggest one.</div>
<div class="cap" id="c3a">Same nights.</div>
<div class="cap" id="c3b"><em>One kept going.</em></div>
<div class="lab" id="cit">SAHIH AL-BUKHARI 6464</div>
<div class="lab" id="hd">@YOURPAGE</div>
<script>
window.SIZE={W:1080,H:1920};window.DURATION=10;
const $=id=>document.getElementById(id),clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-clamp(x),3),sm=x=>{x=clamp(x);return x*x*(3-2*x)},inout=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const SFX=[];window.SFX=SFX;const add=(t,type,v)=>SFX.push({t,type,v});
const INK='#efe8d8',ACC='#f0b35a';
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=(a,b)=>{const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};

/* ---- the one path: built once, a single unbroken polyline ---- */
const G=900,raw=[],segs=[];
const seg=(t0,t1)=>segs.push({t0,t1,i0:Math.max(0,raw.length-1),i1:0});
const endSeg=()=>{segs[segs.length-1].i1=raw.length-1};
const P=(x,y)=>raw.push([x,y]);
function bez(p0,c1,c2,p3,n){for(let i=raw.length?1:0;i<=n;i++){const u=i/n,v=1-u;P(v*v*v*p0[0]+3*v*v*u*c1[0]+3*v*u*u*c2[0]+u*u*u*p3[0],v*v*v*p0[1]+3*v*v*u*c1[1]+3*v*u*u*c2[1]+u*u*u*p3[1])}}
function arc(cx,cy,r0,r1,a0,a1,n){for(let i=raw.length?1:0;i<=n;i++){const u=i/n,a=a0+(a1-a0)*u,r=r0+(r1-r0)*u;P(cx+r*Math.cos(a),cy+r*Math.sin(a))}}
const marks={};
// 1 night: a crescent drawn in one stroke
seg(.2,1.6);arc(320,700,140,140,Math.PI/3,5*Math.PI/3,70);endSeg();
seg(1.6,2.2);bez([320+140*Math.cos(5*Math.PI/3),700+140*Math.sin(5*Math.PI/3)],[238,640],[238,764],[320+140*Math.cos(Math.PI/3),700+140*Math.sin(Math.PI/3)],36);endSeg();
// the crescent's tip slides down to the ground
seg(2.2,3.0);{const s=raw[raw.length-1];bez(s,[s[0]+80,s[1]+26],[560,G],[680,G],40)}endSeg();
// 2 the big deed: one tall peak
seg(3.0,4.8);for(let i=1;i<=90;i++){const u=i/90;P(680+300*u,G-380*Math.pow(Math.sin(Math.PI*u),1.6));if(i===45)marks.peak=raw.length-1}endSeg();
seg(4.8,5.0);for(let i=1;i<=6;i++)P(980+90*i/6,G);endSeg();
// 3 small nights: seven low arches, each one lit as the line passes
const ARCH=7;marks.arch=[];
for(let k=0;k<ARCH;k++){const X0=1070+150*k;seg(5.0+.3*k,5.3+.3*k);
  for(let i=1;i<=26;i++){const u=i/26;P(X0+110*u,G-125*Math.pow(Math.sin(Math.PI*u),1.3));if(i===13)marks.arch.push(raw.length-1)}
  for(let i=1;i<=4;i++)P(X0+110+40*i/4,G);endSeg()}
// 4 the same line stands up: a stem, two leaves, a curl
const SX=2120,stem=v=>[SX+22*Math.sin(v*3),G-470*v];
function stemTo(v0,v1,t0,t1){seg(t0,t1);for(let i=1;i<=24;i++){const p=stem(v0+(v1-v0)*i/24);P(p[0],p[1])}endSeg()}
function leaf(v,d,t0,t1){seg(t0,t1);const s=stem(v),x=s[0],y=s[1];
  bez(s,[x+d*30,y-90],[x+d*120,y-104],[x+d*155,y-44],26);
  bez([x+d*155,y-44],[x+d*112,y+26],[x+d*46,y+22],s,26);endSeg()}
stemTo(0,.34,7.1,7.55);leaf(.34,-1,7.55,7.9);stemTo(.34,.64,7.9,8.2);leaf(.64,1,8.2,8.55);stemTo(.64,1,8.55,8.85);
const topP=stem(1);seg(8.85,9.3);arc(topP[0]+55,topP[1],55,9,Math.PI,Math.PI+2.5*Math.PI,64);endSeg();
marks.bud=raw.length-1;

// cumulative length of raw, then resample every STEP px
const cum=[0];for(let i=1;i<raw.length;i++)cum.push(cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));
const TOTAL=cum[cum.length-1],STEP=4,pts=[];
{let j=1;for(let s=0;s<=TOTAL;s+=STEP){while(cum[j]<s&&j<raw.length-1)j++;const u=(s-cum[j-1])/Math.max(1e-6,cum[j]-cum[j-1]);pts.push([raw[j-1][0]+(raw[j][0]-raw[j-1][0])*u,raw[j-1][1]+(raw[j][1]-raw[j-1][1])*u])}}
segs.forEach(g=>{g.sA=cum[g.i0];g.sB=cum[g.i1]});
// time to arc length: pen moves a little faster mid-stroke, slower at the joins
function tipS(t){if(t<=segs[0].t0)return 0;for(const g of segs){if(t<=g.t1){const u=clamp((t-g.t0)/(g.t1-g.t0));return g.sA+(g.sB-g.sA)*(.65*u+.35*sm(u))}}return TOTAL}
function posAt(s){const f=clamp(s,0,TOTAL)/STEP,i=Math.min(pts.length-2,Math.floor(f)),u=f-i;return[pts[i][0]+(pts[i+1][0]-pts[i][0])*u,pts[i][1]+(pts[i+1][1]-pts[i][1])*u]}
function litTime(idx){const s=cum[idx];for(let t=0;t<=10;t+=.01)if(tipS(t)>=s)return t;return 10}
const peakT=litTime(marks.peak),archT=marks.arch.map(litTime),budT=litTime(marks.bud);

// width along the line: a brush that swells and thins, thin at the start
const swell=s=>.72+.28*(Math.sin(s*.019+1)*.5+Math.sin(s*.0071+2)*.5);
const wid=s=>9*swell(s)*(.25+.75*sm(s/160));

// seeded night sky
const rs=rng(7),STARS=[];for(let i=0;i<70;i++)STARS.push({x:rs()*1500,y:230+rs()*620,r:1.3+rs()*2.1,o:.18+rs()*.42,p:rs()*6.28});

// camera: follows the pen with a short look-ahead, then pulls back to show the whole life
function tipX(t){return posAt(tipS(t))[0]}
function cam(t){let a=0;for(let d=-.6;d<=.6001;d+=.1)a+=tipX(t+d);a/=13;
  const k=zoom(t),lead=100*ease((t-2.5)/1)/k,tr=a-lead;
  return tr+(1500-tr)*ease((t-6.7)/2.2)}
function zoom(t){return 1-.42*inout((t-6.7)/2.2)}

add(.45,'tap',.22);add(peakT,'plink',.3);add(6.15,'tap',.22);add(budT,'plink',.26);

window.frame=function(t){
  const k=zoom(t),cx=cam(t),S=tipS(t),fr=Math.floor(t*15);
  const X=x=>(x-cx)*k+540,Y=y=>(y-G)*k+900;
  // stars (slow parallax, no zoom)
  let st='';for(const q of STARS){const x=((q.x-cx*.25)%1400+1400)%1400-160;st+=`<circle cx="${x.toFixed(1)}" cy="${q.y}" r="${q.r}" fill="${INK}" opacity="${(q.o+.12*Math.sin(t*1.4+q.p)).toFixed(3)}"/>`}
  $('stars').innerHTML=st;
  // ribbon polygon along the drawn part, with a gentle boil that re-rolls every other frame
  const n=Math.min(pts.length-1,Math.floor(S/STEP)),L=[],R=[],C=[];
  for(let i=0;i<=n;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
    const nx=-dy,ny=dx,bo=Math.sin(i*.33+fr*1.9)*.9+(hash(i,fr)-.5)*.8,w=wid(i*STEP)*.5*k+.3,px=X(pts[i][0])+nx*bo,py=Y(pts[i][1])+ny*bo;
    L.push(`${(px+nx*w).toFixed(1)},${(py+ny*w).toFixed(1)}`);R.push(`${(px-nx*w).toFixed(1)},${(py-ny*w).toFixed(1)}`);C.push(`${px.toFixed(1)},${py.toFixed(1)}`)}
  const tp=posAt(S),tx=X(tp[0]),ty=Y(tp[1]);
  let w='';
  if(n>1){
    w+=`<polyline points="${C.join(' ')}" fill="none" stroke="${INK}" stroke-opacity=".07" stroke-width="${34*k}" stroke-linecap="round" stroke-linejoin="round"/>`;
    w+=`<polyline points="${C.join(' ')}" fill="none" stroke="${INK}" stroke-opacity=".12" stroke-width="${17*k}" stroke-linecap="round" stroke-linejoin="round"/>`;
    w+=`<polygon points="${L.join(' ')} ${R.reverse().join(' ')}" fill="${INK}"/>`;
    w+=`<circle cx="${C[0].split(',')[0]}" cy="${C[0].split(',')[1]}" r="2" fill="${INK}"/>`;
  }
  // lit nights
  const dot=(p,lit,keep)=>{const x=X(p[0]),y=Y(p[1]-0),r=13*k+2;
    if(lit<=0)return'';let v=lit;let s='';
    if(!keep){v=lit*(1-.82*ease((t-peakT-.5)/.7));s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${INK}" opacity="${(.55*lit*(1-v/Math.max(lit,.001))).toFixed(3)}"/>`}
    s+=`<circle cx="${x}" cy="${y}" r="${(70*k+30)*(.6+.4*v)}" fill="url(#gl)" opacity="${v.toFixed(3)}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${ACC}" opacity="${v.toFixed(3)}"/>`;return s};
  w+=dot(pts[Math.round(cum[marks.peak]/STEP)],ease((t-peakT)/.35),false);
  marks.arch.forEach((m,i)=>{w+=dot(pts[Math.round(cum[m]/STEP)],ease((t-archT[i])/.35),true)});
  {const b=pts[pts.length-1],lit=ease((t-budT)/.5),x=X(b[0]),y=Y(b[1]);if(lit>0)w+=`<circle cx="${x}" cy="${y}" r="${(90*k+30)*(.5+.5*lit)}" fill="url(#gl)" opacity="${lit}"/><circle cx="${x}" cy="${y}" r="${10*k+3}" fill="${ACC}" opacity="${lit}"/>`}
  // the pen tip
  if(t>.2&&S<TOTAL-1)w+=`<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="46" fill="url(#gw)"/><circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="${(6+3*Math.sin(t*9)*0)*1+2}" fill="#fff8ea"/>`;
  $('world').innerHTML=w;
  // captions
  const up=(id,a,b,dy=14)=>{const p=ease((t-a)/.6),q=b?1-ease((t-b)/.45):1,o=Math.min(p,q),e=$(id);e.style.opacity=o;e.style.transform=`translateY(${(1-p)*dy}px)`};
  up('c1',.4,4.5);up('b1',.3,6.2);up('c2',4.8,6.2);
  up('b3',5.4);up('c3a',5.7);up('c3b',6.7);up('cit',7.6,null,8);up('hd',8.4,null,8);
  return{};
};
document.fonts.ready.then(()=>{
  const c=$('grain'),g=c.getContext('2d'),im=g.createImageData(540,960),r=rng(11);
  for(let i=0;i<im.data.length;i+=4){const v=120+r()*135|0;im.data[i]=v;im.data[i+1]=v-6;im.data[i+2]=v-18;im.data[i+3]=255}
  g.putImageData(im,0,0);frame(0);window.ready=true});
</script></body></html>
