<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Low-poly birds: the engine from The Wing (QURAN 17:24), shown here as a 10 s cut of
// four moments (storm wing, seasons and catch, flight, winter wing). Reuse: rng/noise, makeCam, blob/limb/quad builders,
// birdTris (posable bird: spread, flap, curl, lift), the tree and nest in buildWorld, env() palette keys, RAIN/SNOW/PET
// particles, draw3D (painter sort, fog, blurred background pass), pen() for the Arabic. The full 49 s reel is the source.
// The Wing: Low-poly faceted world in a "Sorbet dusk" pastel palette: a parent bird spreads its wing
// over a chick in a storm, the seasons turn, the chick grows and flies, and in winter it lowers its own wing over
// the old bird. A small software 3D pipeline: look-at camera, flat Lambert facets, painter's sort, depth fog,
// a background pass that can be blurred for shallow focus, and screen and world particles (rain, petals, snow).
window.SIZE={W:1080,H:1920};window.DURATION=10;
const W=1080,HH=1920,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=HH;const bx=bgc.getContext('2d');
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)};
const E={out:t=>1-Math.pow(1-clamp(t),3),inOut:t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2},back:t=>{t=clamp(t);const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
const hexA=h=>{h=h.replace('#','');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]};
const mix=(a,b,t)=>{a=Array.isArray(a)?a:hexA(a);b=Array.isArray(b)?b:hexA(b);return[0,1,2].map(i=>a[i]+(b[i]-a[i])*t)};
const css=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
function rng(seed){let a=seed>>>0||1;const r=()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};r.range=(l,h)=>l+r()*(h-l);r.pick=a=>a[Math.floor(r()*a.length)];return r}
function makeNoise(seed){const r=rng(seed),p=new Uint8Array(512),perm=[...Array(256).keys()];for(let i=255;i>0;i--){const j=Math.floor(r()*(i+1));[perm[i],perm[j]]=[perm[j],perm[i]]}for(let i=0;i<512;i++)p[i]=perm[i&255];
  const fade=t=>t*t*t*(t*(t*6-15)+10),lp=(a,b,t)=>a+(b-a)*t,g3=(h,x,y,z)=>{h&=15;const u=h<8?x:y,v=h<4?y:h===12||h===14?x:z;return((h&1)?-u:u)+((h&2)?-v:v)};
  function n3(x,y,z){const X=Math.floor(x)&255,Y=Math.floor(y)&255,Z=Math.floor(z)&255;x-=Math.floor(x);y-=Math.floor(y);z-=Math.floor(z);const u=fade(x),v=fade(y),w=fade(z);
    const A=p[X]+Y,AA=p[A]+Z,AB=p[A+1]+Z,B=p[X+1]+Y,BA=p[B]+Z,BB=p[B+1]+Z;
    return lp(lp(lp(g3(p[AA],x,y,z),g3(p[BA],x-1,y,z),u),lp(g3(p[AB],x,y-1,z),g3(p[BB],x-1,y-1,z),u),v),lp(lp(g3(p[AA+1],x,y,z-1),g3(p[BA+1],x-1,y,z-1),u),lp(g3(p[AB+1],x,y-1,z-1),g3(p[BB+1],x-1,y-1,z-1),u),v),w)}
  return{fbm2:(x,y,o=4)=>{let s=0,a=.5,f=1,n=0;for(let i=0;i<o;i++){s+=a*n3(x*f,y*f,.5);n+=a;a*=.5;f*=2}return s/n}}}

// ---------------- sound: soft and sparse, one at a time (add(t,type,v,pan))
const SFX=[];window.SFX=SFX;const add=(t,type,v,pan)=>SFX.push({t,type,v,pan:pan||0});
// normal levels and a few more soft moments
add(1.95,'kit:whoosh-medium-soft',.8,0);   // the wing unfolds
add(2.3,'drop',.8,-.05);                   // the raindrop meets the wing
add(5.0,'drop',.5,.25);                    // a second drop taps the feathers
add(7.4,'kit:whoosh-slow-soft',.7,-.1);    // the push under the feathers
add(9.6,'drop',.45,-.2);                   // rain tapping the wing above the chick
add(12.6,'kit:shimmer-medium-soft',.6,0);  // the storm clears, the seasons begin
add(14.2,'kit:impact-light-soft',.7,-.1);  // the parent settles on the nest
add(15.0,'plink',.75,.1);                  // food lands in the beak
add(17.2,'kit:faller-1s-soft',.6,.1);      // the chick tumbles
add(18.2,'kit:swish-soft',.8,.1);          // the wing sweeps in and catches
add(19.8,'kit:whoosh-slow-soft',.8,.2);    // the flight
add(21.4,'kit:whoosh-medium-soft',.55,-.1);// the dive
add(23.6,'kit:whoosh-slow-soft',.7,-.2);   // the turn back
add(24.6,'kit:shimmer-long-soft',.6,0);    // the whiteout into winter
add(27.4,'kit:impact-light-soft',.6,0);    // the grown bird lands in the snow
add(29.5,'kit:whoosh-slow-soft',.8,0);     // the wing lowers
add(31.6,'bell',.8,0);                     // the dua starts
add(35.0,'plink',.65,0);                   // the English
add(35.7,'glass',.6,0);                    // the citation
add(42.2,'kit:shimmer-medium-soft',.55,0); // first light
add(45.2,'bell2',.75,0);                   // the end card

// ---------------- vectors, camera
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],scl=(a,k)=>[a[0]*k,a[1]*k,a[2]*k],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const lerp3=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const CX=540,CY=960;let F=1100;
function makeCam(pos,tgt,roll,f){const fw=norm(sub(tgt,pos));let r=norm(cross([0,1,0],fw));let u=cross(fw,r);
  if(roll){const c=Math.cos(roll),s=Math.sin(roll),r2=add3(scl(r,c),scl(u,s)),u2=add3(scl(u,c),scl(r,-s));r=r2;u=u2}
  return{pos,fw,r,u,roll:roll||0,proj(p){const d=sub(p,pos),z=dot(d,fw);return[CX+f*dot(d,r)/z,CY-f*dot(d,u)/z,z]}}}

// ---------------- palette: Sorbet dusk
const PAL={
  storm:{top:'#4d4a8c',mid:'#7d70b4',low:'#b296c8',hz:'#d9b3cc',fog:[150,136,190],amb:[170,158,214],sun:[200,186,240],sd:[-.4,.7,-.3],season:0,rain:1,snow:0,cloud:[150,138,196]},
  spring:{top:'#9dc0ef',mid:'#c9daf6',low:'#f7d4e0',hz:'#ffe5d8',fog:[240,218,228],amb:[226,214,236],sun:[255,236,222],sd:[-.5,.75,-.45],season:1,rain:0,snow:0,cloud:[255,244,246]},
  summer:{top:'#8fbcee',mid:'#c6dcf4',low:'#ffdcc4',hz:'#ffd5ae',fog:[246,222,206],amb:[228,216,232],sun:[255,232,206],sd:[-.3,.85,-.4],season:2,rain:0,snow:0,cloud:[255,246,236]},
  autumn:{top:'#b2acea',mid:'#e8c3d8',low:'#ffc6a6',hz:'#ffd09e',fog:[244,204,190],amb:[226,204,222],sun:[255,214,180],sd:[-.6,.55,-.5],season:3,rain:0,snow:0,cloud:[255,226,214]},
  flight:{top:'#9cbcf0',mid:'#ecc8dc',low:'#ffc4a4',hz:'#ffe0bd',fog:[246,212,206],amb:[226,208,230],sun:[255,220,186],sd:[-.35,.5,.75],season:3,rain:0,snow:0,cloud:[255,232,224]},
  winter:{top:'#a3b9ea',mid:'#c6d2f2',low:'#e4dcf2',hz:'#f6e6ef',fog:[226,226,244],amb:[226,226,246],sun:[246,240,255],sd:[-.4,.7,-.5],season:4,rain:0,snow:1,cloud:[244,242,252]},
  dawn:{top:'#bdb2ea',mid:'#f4c3d2',low:'#ffc59e',hz:'#ffe0b4',fog:[248,210,198],amb:[232,210,226],sun:[255,214,170],sd:[-.75,.32,.55],season:4.7,rain:0,snow:.15,cloud:[255,222,206]}};
// env keys (time, palette); blended with smoothstep between neighbours
const EK=[[0,'storm'],[12.0,'storm'],[12.5,'spring'],[13.9,'spring'],[14.3,'summer'],[15.8,'summer'],[16.2,'autumn'],[19,'autumn'],[20.2,'flight'],[24.95,'flight'],[25,'winter'],[41.8,'winter'],[42.6,'dawn'],[49,'dawn']];
function env(t){let i=0;while(i<EK.length-2&&t>EK[i+1][0])i++;const[a0,na]=EK[i],[a1,nb]=EK[i+1],k=smooth(a0,a1,t),A=PAL[na],B=PAL[nb],o={};
  for(const key in A){const va=A[key],vb=B[key];o[key]=typeof va==='string'?mix(va,vb,k):Array.isArray(va)?mix(va,vb,k):lerp(va,vb,k)}o.sd=norm(o.sd);return o}

// ---------------- world (built once)
const nz=makeNoise(17);
const N=[7,9.1,0.2];                                 // nest centre
const smax=(a,b,k)=>(a+b+Math.sqrt((a-b)*(a-b)+k))/2;
function height(x,z){const r=Math.hypot(x,z);
  const hill=1.2-Math.pow(r/20,2)*13+nz.fbm2(x*.08,z*.08,3)*1.2;
  const val=-42+Math.pow(Math.abs(x)/150,2)*70+nz.fbm2(x*.02,z*.02,4)*9+smooth(330,520,z)*95+smooth(-40,-140,z)*40;
  return smax(hill,val,30)}
const tris=[];
function T(a,b,c,col,o){tris.push(Object.assign({p:[a,b,c],col},o||{}))}
function quad(a,b,c,d,col,o){T(a,b,c,col,o);T(a,c,d,col,o)}
const ICO=(()=>{const p=(1+Math.sqrt(5))/2,v=[[-1,p,0],[1,p,0],[-1,-p,0],[1,-p,0],[0,-1,p],[0,1,p],[0,-1,-p],[0,1,-p],[p,0,-1],[p,0,1],[-p,0,-1],[-p,0,1]].map(norm);
  const f=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];return{v,f}})();
function blob(c,r,sq,col,o,seed){const jr=rng(seed||1);const vs=ICO.v.map(v=>{const k=1+(jr()-.5)*.28;return[c[0]+v[0]*r*k,c[1]+v[1]*r*k*sq,c[2]+v[2]*r*k]});
  for(const[a,b,cc]of ICO.f)T(vs[a],vs[b],vs[cc],col,Object.assign({center:c},o||{}))}
// a tapered n-sided limb between two points
function limb(p0,p1,r0,r1,n,col,o){const ax=norm(sub(p1,p0)),ref=Math.abs(ax[1])>.9?[1,0,0]:[0,1,0],u=norm(cross(ax,ref)),v=cross(ax,u),ctr=scl(add3(p0,p1),.5);
  const ring=(p,r)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2;return add3(p,add3(scl(u,Math.cos(a)*r),scl(v,Math.sin(a)*r)))});
  const A=ring(p0,r0),B=ring(p1,r1);for(let i=0;i<n;i++){const j=(i+1)%n;quad(A[i],A[j],B[j],B[i],col,Object.assign({center:ctr,axis:[p0,p1]},o||{}))}
  T(B[0],B[1],B[2],col,Object.assign({center:ctr},o||{}));}
const BARK=[178,136,150],TWIG=[206,160,150],ROCK=[188,172,216];
const GROUND=[[170,200,184],[198,226,196],[214,230,180],[240,204,162],[238,242,252],[214,228,206]];
const LEAF=[[168,206,190],[250,186,206],[178,222,184],[252,184,134],[240,244,252],[250,196,214]];
const seasonCol=(arr,s)=>{s=clamp(s,0,arr.length-1);const i=Math.min(arr.length-2,Math.floor(s));return mix(arr[i],arr[i+1],s-i)};
let BUILT=false;
function buildWorld(){
  // terrain
  const CELL=9,X0=-270,X1=270,Z0=-170,Z1=560,nx=Math.round((X1-X0)/CELL),nzc=Math.round((Z1-Z0)/CELL),jr=rng(5),Vt=[];
  for(let j=0;j<=nzc;j++){const row=[];for(let i=0;i<=nx;i++){const x=X0+i*CELL+(i>0&&i<nx?jr.range(-.36,.36)*CELL:0),z=Z0+j*CELL+(j>0&&j<nzc?jr.range(-.36,.36)*CELL:0);row.push([x,height(x,z),z])}Vt.push(row)}
  const jc=rng(77);
  for(let j=0;j<nzc;j++)for(let i=0;i<nx;i++){const a=Vt[j][i],b=Vt[j][i+1],c=Vt[j+1][i],d=Vt[j+1][i+1],flip=((i*7+j*13)%3===0),pairs=flip?[[a,b,d],[a,d,c]]:[[a,b,c],[b,d,c]];
    for(const pp of pairs){const n=norm(cross(sub(pp[1],pp[0]),sub(pp[2],pp[0])));const slope=1-Math.abs(n[1]);T(pp[0],pp[1],pp[2],null,{ground:true,rock:slope>.42,jit:1+(jc()-.5)*.1})}}
  // a finer patch under the tree so the hilltop reads close up
  // the river down the valley floor
  for(let z=30;z<500;z+=8){const x=Math.sin(z*.018)*22,y0=height(x,z)+.4,y1=height(x,z+8)+.4,x1=Math.sin((z+8)*.018)*22,w=lerp(3,9,z/500);
    quad([x-w,y0,z],[x+w,y0,z],[x1+w,y1,z+8],[x1-w,y1,z+8],[170,200,236],{water:true,bias:-.5})}
  // valley trees: round crowns and pines, all take the season colour
  const tr=rng(41);for(let k=0;k<150;k++){const z=tr.range(20,430),x=tr.range(-170,170);if(Math.abs(x-Math.sin(z*.018)*22)<12)continue;const y=height(x,z);if(y>-8&&Math.hypot(x,z)<40)continue;
    const h=tr.range(5,10);if(tr()<.55){limb([x,y-1,z],[x,y+h*.5,z],.6,.4,4,BARK);blob([x,y+h*.75,z],h*.38,1,null,{leaf:true},k)}else{limb([x,y-1,z],[x,y+h,z],.5,.15,4,BARK);
      const r=h*.32;for(let q=0;q<2;q++){const yy=y+h*.35+q*h*.28,rr=r*(1-q*.3),n=6,top=[x,yy+h*.45,z];for(let i=0;i<n;i++){const a0=i/n*Math.PI*2,a1=(i+1)/n*Math.PI*2;T([x+Math.cos(a0)*rr,yy,z+Math.sin(a0)*rr],[x+Math.cos(a1)*rr,yy,z+Math.sin(a1)*rr],top,null,{leaf:true,center:[x,yy+h*.15,z]})}}}}
  // the tree on the hilltop
  limb([0,-2,0],[0,7,0],1.0,.7,7,BARK);limb([0,7,0],[.3,12.5,0],.7,.38,7,BARK);
  limb([.1,7.4,0],[4,8.4,.1],.42,.28,6,BARK);limb([4,8.4,.1],[N[0]+.6,N[1]-.3,N[2]],.28,.17,6,BARK);   // the nest branch
  limb([N[0]+.4,N[1]-.3,N[2]],[N[0]+2.4,N[1]+.6,N[2]-.4],.15,.06,5,BARK);
  limb([0,9,0],[-5,12.5,1.2],.45,.2,6,BARK);limb([.2,10.3,0],[4,13.4,-1.5],.4,.18,6,BARK);limb([.3,12,0],[-1,15.2,.6],.35,.15,6,BARK);limb([0,8.2,0],[-3.6,10,-2.4],.3,.14,5,BARK);
  const crowns=[[[-5,13.2,1.2],3],[[4.2,14.2,-1.5],3.2],[[-1,16.4,.6],3.4],[[1.6,12.6,2.6],2.5],[[-3.4,15.4,-2],2.6],[[-3.8,10.6,-2.6],1.9]];
  // each crown is a cluster of small leaf lumps, so it reads as leaves and not one flat block
  crowns.forEach(([c,r],k)=>{const cr2=rng(k+90);blob(c,r*.5,.8,null,{leaf:true,crown:true,ccen:c},k+90);
    for(let q=0;q<7;q++){const a=cr2()*Math.PI*2,e=cr2.range(-.5,.9),d=r*.62,pc=[c[0]+Math.cos(a)*d*(1-Math.abs(e)*.4),c[1]+e*d*.8,c[2]+Math.sin(a)*d*(1-Math.abs(e)*.4)];
      blob(pc,r*cr2.range(.36,.5),.8,null,{leaf:true,crown:true,ccen:c},k*10+q+120)}});
  // snow caps along the tree's limbs (winter only)
  for(const[a,b]of[[[0,7,0],[.3,12.5,0]],[[.1,7.4,0],[4,8.4,.1]],[[4,8.4,.1],[N[0]+.6,N[1]-.3,N[2]]],[[0,9,0],[-5,12.5,1.2]],[[.2,10.3,0],[4,13.4,-1.5]]]){
    const segs=4;for(let s=0;s<segs;s++){const p0=lerp3(a,b,s/segs),p1=lerp3(a,b,(s+1)/segs),w=.32;quad([p0[0],p0[1]+.32,p0[2]-w],[p1[0],p1[1]+.3,p1[2]-w],[p1[0],p1[1]+.3,p1[2]+w],[p0[0],p0[1]+.32,p0[2]+w],[246,248,255],{snow:true,flatUp:true})}}
  // the nest: a woven bowl
  {const n=12,ro=1.3,ri=.9,rb=.62,yr=N[1]+.42,yb=N[1]-.42,cc=[N[0],N[1],N[2]];const jt=rng(9);
    const ring=(r,y,j)=>Array.from({length:n},(_,i)=>{const a=i/n*Math.PI*2+.13,k=1+(j?(jt()-.5)*.12:0);return[N[0]+Math.cos(a)*r*k,y+(j?(jt()-.5)*.12:0),N[2]+Math.sin(a)*r*k]});
    const O=ring(ro,yr,1),I=ring(ri,yr-.04,1),B=ring(rb,yb,1),IB=ring(ri*.6,N[1]-.12,0);
    for(let i=0;i<n;i++){const j=(i+1)%n,c1=mix(TWIG,[176,130,132],(i%3)/3);
      quad(B[i],B[j],O[j],O[i],c1,{center:cc,nest:true});quad(O[i],O[j],I[j],I[i],mix(c1,[232,196,180],.4),{nest:true,flatUp:true});
      quad(I[i],I[j],IB[j],IB[i],[150,112,126],{nest:true,inward:cc});}
    for(let i=1;i<n-1;i++)T(IB[0],IB[i],IB[i+1],[138,104,120],{nest:true,flatUp:true});
    for(let k=0;k<9;k++){const a=jt()*Math.PI*2,a2=a+jt()*.8,p0=[N[0]+Math.cos(a)*1.1,N[1]+.1+jt()*.25,N[2]+Math.sin(a)*1.1],p1=[N[0]+Math.cos(a2)*1.9,N[1]+.2+jt()*.4,N[2]+Math.sin(a2)*1.9];limb(p0,p1,.05,.03,3,[190,146,140],{nest:true})}}
  // clouds far away, all around (so the turn-back shot has sky too)
  const cr=rng(23);for(let k=0;k<26;k++){const a=cr.range(-1.4,1.4)+(k%3===0?Math.PI:0),d=cr.range(520,700),c=[Math.sin(a)*d,cr.range(110,230),Math.cos(a)*d];
    for(let q=0;q<3;q++)blob(add3(c,[cr.range(-40,40),cr.range(-6,10),cr.range(-20,20)]),cr.range(26,48),.45,null,{cloud:true},k*7+q)}
  for(const t of tris){const[a,b,c]=t.p;let n=norm(cross(sub(b,a),sub(c,a)));const ce=scl(add3(add3(a,b),c),1/3);
    if(t.ground||t.water||t.flatUp){if(n[1]<0)n=scl(n,-1)}else if(t.inward){if(dot(n,sub(t.inward,ce))<0)n=scl(n,-1)}else if(t.center){if(dot(n,sub(ce,t.center))<0)n=scl(n,-1)}
    t.n=n;t.cen=ce;t.jt=Math.abs((Math.sin(ce[0]*12.9898+ce[2]*78.233)*43758.5453)%1)}
  BUILT=true}

// ---------------- birds
const BC={P:{body:[246,180,156],belly:[255,236,222],wA:[196,170,232],wB:[150,148,218],tail:[158,148,214],beak:[255,204,124],eye:[74,44,92]},

};

const CUTS=[[1.2,2.5],[15.6,2.5],[21.4,2.5],[26.9,2.5]];

{const keep=[];let a=0;for(const[s,l]of CUTS){for(const e of SFX)if(e.t>=s&&e.t<s+l)keep.push(Object.assign({},e,{t:a+e.t-s}));a+=l}SFX.length=0;keep.forEach(e=>SFX.push(e))}
