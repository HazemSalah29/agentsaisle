# Approved Arabic terms for video narration and on-screen text. `apply` reports a violation when an English
# source contains the term but the Arabic translation lacks an approved form, or when a brand is translated.
# List accepted forms of one term with "|" (Arabic changes definite, indefinite and possessive forms).
# Add your own brand names and terms before translating. These are a starting point, not a reviewed list.
brands:
  - Agent Aisle
terms:
  - en: rate limit
    ar: تحديد المعدل|الحد من المعدل|حد المعدل|حدّ المعدّل
  - en: request
    ar: طلب|الطلب|طلبات|الطلبات|طلبًا
  - en: server
    ar: خادم|الخادم|الخوادم|خوادم
  - en: database
    ar: قاعدة بيانات|قاعدة البيانات|قواعد البيانات
