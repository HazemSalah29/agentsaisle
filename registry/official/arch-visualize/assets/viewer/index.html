<!doctype html>
<!-- arch-visualize viewer v2 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Architecture</title>
    <style>
      /*__STYLES__*/
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">Architecture</h1>
      <p>
        Generated from code; not live traffic. It shows how requests would travel, based on the
        files read.
      </p>
      <button type="button" id="open-risks" class="phone-only">Risks</button>
      <button type="button" id="theme">Switch theme</button>
    </header>
    <main>
      <div id="center">
        <div id="flowbar" class="flowbar" hidden>
          <div class="flowtabs" id="flowtabs" role="tablist" aria-label="Request flows"></div>
          <div class="flowctl">
            <button type="button" id="fback">Back</button>
            <button type="button" id="fplay">Play</button>
            <button type="button" id="fstep">Step</button>
            <button type="button" id="frestart">Restart</button>
            <label
              >Speed
              <select id="fspeed">
                <option value="0.5">0.5x</option>
                <option value="1" selected>1x</option>
                <option value="2">2x</option>
              </select>
            </label>
          </div>
        </div>
        <div id="caption" class="caption" aria-live="polite" hidden></div>
        <section
          id="stage"
          tabindex="0"
          aria-label="Architecture diagram. Arrow keys pan, plus and minus zoom, zero fits the view."
        >
          <svg
            id="canvas"
            role="group"
            aria-label="Components and the connections between them"
          ></svg>
          <div id="zoom">
            <button type="button" id="zin" aria-label="Zoom in">+</button>
            <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
            <button type="button" id="zfit">Fit</button>
          </div>
        </section>
        <section id="list" aria-label="Components"></section>
      </div>
      <aside id="panel" aria-live="polite">
        <button type="button" class="close" id="close">Close</button>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" id="tab-details" aria-selected="true">Details</button>
          <button type="button" role="tab" id="tab-flow" aria-selected="false" hidden>Flow</button>
          <button type="button" role="tab" id="tab-risks" aria-selected="false">Risks</button>
        </div>
        <div id="body"></div>
      </aside>
    </main>
    <script type="application/json" id="model">
      __MODEL_JSON__
    </script>
    <script type="application/json" id="icons">
      __ICONS_JSON__
    </script>
    <script>
      /*__LIB_JS__*/
    </script>
    <script>
      /*__VIEWER_JS__*/
    </script>
  </body>
</html>
