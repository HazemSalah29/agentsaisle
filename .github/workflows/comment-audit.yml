name: Comment audit report

# Posts the audit report from "Validate registry entries" on the pull request. It is a separate
# workflow because pull requests from forks get a read-only token in the first one. This workflow
# never checks out or runs anything from the pull request: it only reads a text artifact.
on:
  workflow_run:
    workflows: ["Validate registry entries"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download the report
        id: download
        # No artifact means no community entry changed, so there is nothing to say.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: audit-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: audit-out
      - name: Post or update the comment
        if: steps.download.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const info = JSON.parse(fs.readFileSync("audit-out/audit-pr.json", "utf8"));
            const body = fs.readFileSync("audit-out/audit-report.md", "utf8");
            const number = info.pr;
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed("The report names no pull request.");
              return;
            }
            if (!body.startsWith("<!-- aisle-audit -->") || body.length > 65000) {
              core.setFailed("The report is not in the expected format.");
              return;
            }
            // A pull request can change the first workflow, so check the report belongs to this run.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.notice("The pull request has moved on since this run; not commenting.");
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user.type === "Bot" && c.body.startsWith("<!-- aisle-audit -->"),
            );
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: number, body,
              });
            }
