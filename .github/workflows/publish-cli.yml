name: Publish CLI

# Publishes @agentsaisle/cli to npm with npm's trusted publishing (OIDC): no token is stored anywhere. On npm, the
# package's Trusted Publisher is set to this repository, this file name (publish-cli.yml) and the environment
# `npm-publish`. Push a tag like `cli-v0.2.1` (it must match packages/cli/package.json) or run the workflow by hand.
on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    # Matches the environment named in npm's Trusted Publisher settings. GitHub creates it on the first run; add
    # required reviewers under Settings > Environments > npm-publish to make a person approve each release.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Build the audit package and its dependencies (the CLI inlines them)
        run: pnpm --filter "@agentsaisle/audit..." build
      - run: pnpm --filter @agentsaisle/cli test
      - run: pnpm --filter @agentsaisle/cli build
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          want="${GITHUB_REF_NAME#cli-v}"
          have=$(node -p "require('./packages/cli/package.json').version")
          if [ "$want" != "$have" ]; then echo "Tag $GITHUB_REF_NAME does not match package version $have"; exit 1; fi
      - name: Use an npm that supports trusted publishing (11.5.1 or newer)
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish
        working-directory: packages/cli
        run: npm publish --provenance --access public
