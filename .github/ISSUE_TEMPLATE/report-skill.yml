name: Report a skill
description: Tell us about a skill that is unsafe, broken, outdated or misleading.
title: "Report: "
labels: ["skill-report"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill name
      description: The name as it appears in the registry, for example `explore`.
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: What is wrong?
      options:
        - Unsafe or malicious behavior
        - Broken or does not work
        - Outdated
        - Misleading description
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What happened, which version, and which file or line if you know it.
    validations:
      required: true
